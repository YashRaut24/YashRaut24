<svg width="850" height="310" viewBox="0 0 850 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .portal-bg       { fill: #0B0C10; stroke: #1F2430; stroke-width: 1.5; }
      .tag-lbl         { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #00F0FF; letter-spacing: 2px; }
      .sub-lbl         { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; fill: #71737E; letter-spacing: 1.5px; }
      .name-txt        { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 32px; font-weight: 900; fill: #FDFBF7; letter-spacing: 0.5px; }
      .role-txt        { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #2563EB; letter-spacing: 1px; }
      .bio-txt         { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #A0A5B5; }
      .pill-box        { fill: #111216; stroke: #1F2430; stroke-width: 1; }
      .pill-txt        { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #FDFBF7; letter-spacing: 0.5px; }

      /* Kinetic Stargate Rotations */
      @keyframes portalSpinCW {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes portalSpinCCW {
        from { transform: rotate(360deg); }
        to   { transform: rotate(0deg); }
      }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50%      { opacity: 0.4; transform: scale(0.96); }
      }
      @keyframes rocketAscent {
        0%   { transform: translateY(16px) scale(0.94); opacity: 0.9; }
        50%  { transform: translateY(-8px) scale(1.04); opacity: 1; }
        100% { transform: translateY(16px) scale(0.94); opacity: 0.9; }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.2; }
      }
      @keyframes particleFloat {
        0%   { transform: translateY(0px); opacity: 0; }
        50%  { opacity: 1; }
        100% { transform: translateY(-30px); opacity: 0; }
      }

      .spin-cw     { animation: portalSpinCW 20s linear infinite; transform-origin: 675px 155px; }
      .spin-ccw    { animation: portalSpinCCW 14s linear infinite; transform-origin: 675px 155px; }
      .spin-slow   { animation: portalSpinCW 36s linear infinite; transform-origin: 675px 155px; }
      .pulse       { animation: pulseRing 4s ease-in-out infinite; transform-origin: 675px 155px; }
      .rocket-anim { animation: rocketAscent 3.5s ease-in-out infinite; transform-origin: 675px 155px; }
      .beacon      { animation: beaconBlink 1.2s steps(2, start) infinite; }
      .p1          { animation: particleFloat 2.5s ease-in infinite; }
      .p2          { animation: particleFloat 3.2s ease-in 0.8s infinite; }
    </style>
  </defs>

  <!-- Portal Container Frame -->
  <rect width="850" height="310" rx="6" class="portal-bg"/>

  <!-- Background Space Grid Hatching -->
  <g opacity="0.10" stroke="#2C303B" stroke-width="0.8">
    <line x1="0" y1="50" x2="850" y2="50"/>
    <line x1="0" y1="100" x2="850" y2="100"/>
    <line x1="0" y1="150" x2="850" y2="150"/>
    <line x1="0" y1="200" x2="850" y2="200"/>
    <line x1="0" y1="250" x2="850" y2="250"/>
    <line x1="120" y1="0" x2="120" y2="310"/>
    <line x1="240" y1="0" x2="240" y2="310"/>
    <line x1="360" y1="0" x2="360" y2="310"/>
    <line x1="480" y1="0" x2="480" y2="310"/>
  </g>

  <!-- Top System Header Bar -->
  <g transform="translate(26, 24)">
    <circle cx="0" cy="5" r="4" fill="#00F0FF" class="beacon"/>
    <text x="14" y="9" class="tag-lbl">PORTAL GATEWAY // SECTOR 01: MISSION COMMAND &amp; PILOT IDENTITY</text>
    <text x="560" y="9" class="sub-lbl">[WARP VECTOR: ACTIVE // DOMBIVLI, MUMBAI]</text>
  </g>
  <line x1="0" y1="44" x2="850" y2="44" stroke="#1F2430" stroke-width="1.2"/>

  <!-- Left Mission Deck Content -->
  <g transform="translate(36, 76)">
    <!-- Security Authorization Badge -->
    <rect x="0" y="0" width="220" height="22" rx="3" fill="#111216" stroke="#2563EB" stroke-width="1"/>
    <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="9px" font-weight="700" fill="#00F0FF" letter-spacing="1px">SYS_OP // MERN &amp; AIML ENGINEER</text>

    <!-- Name & Official Title -->
    <text x="0" y="52" class="name-txt">YASH DINESH RAUT</text>
    <text x="0" y="74" class="role-txt">&gt; FULL-STACK DEVELOPER · MACHINE LEARNING SPECIALIST</text>

    <!-- Bio & Education (Real Data from Resume) -->
    <text x="0" y="104" class="bio-txt">B.E. in Computer Engineering · K.C. College of Engineering (CGPA 8.47)</text>
    <text x="0" y="124" class="bio-txt">Hands-on experience architecting full-stack web platforms (MERN Stack)</text>
    <text x="0" y="144" class="bio-txt">and engineering intelligent ML/NLP systems for real-world deployment.</text>

    <!-- Status Badges Row -->
    <g transform="translate(0, 168)">
      <!-- Badge 1: Education -->
      <g transform="translate(0, 0)">
        <rect width="145" height="30" rx="3" class="pill-box"/>
        <circle cx="12" cy="15" r="3.5" fill="#39D353"/>
        <text x="22" y="19" class="pill-txt">CGPA: 8.47 / 10</text>
      </g>

      <!-- Badge 2: Experience -->
      <g transform="translate(155, 0)">
        <rect width="185" height="30" rx="3" class="pill-box"/>
        <circle cx="12" cy="15" r="3.5" fill="#2563EB"/>
        <text x="22" y="19" class="pill-txt">SAPPHIRE INFOCOM INTERN</text>
      </g>

      <!-- Badge 3: Award -->
      <g transform="translate(350, 0)">
        <rect width="140" height="30" rx="3" class="pill-box"/>
        <circle cx="12" cy="15" r="3.5" fill="#F59E0B"/>
        <text x="22" y="19" class="pill-txt">1ST PRIZE AI ART</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Kinetic Space Portal Stargate with Rocket -->
  <g>
    <!-- Stargate Outer Hexagon Ring -->
    <polygon points="675,50 765,102 765,208 675,260 585,208 585,102" fill="none" stroke="#1F2430" stroke-width="1.5" stroke-dasharray="8 4" class="spin-slow"/>
    
    <!-- Outer Rotating Stargate Reticle -->
    <circle cx="675" cy="155" r="100" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="14 10" class="spin-cw"/>
    <circle cx="675" cy="155" r="88" fill="none" stroke="#1F2430" stroke-width="1"/>
    
    <!-- Rotating Intermediate Stargate Ring -->
    <circle cx="675" cy="155" r="76" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="28 14 6 14" class="spin-ccw"/>
    
    <!-- Inner Portal Throat Ring -->
    <circle cx="675" cy="155" r="58" fill="#111216" stroke="#E11D48" stroke-width="2" class="pulse"/>
    <circle cx="675" cy="155" r="46" fill="#0B0C10" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="6 4" class="spin-cw"/>

    <!-- Reticle Crosshairs -->
    <line x1="560" y1="155" x2="790" y2="155" stroke="#1F2430" stroke-width="1"/>
    <line x1="675" y1="40" x2="675" y2="270" stroke="#1F2430" stroke-width="1"/>
    <circle cx="675" cy="155" r="3" fill="#00F0FF"/>

    <!-- Star Warp Particles -->
    <circle cx="665" cy="165" r="1.5" fill="#00F0FF" class="p1"/>
    <circle cx="686" cy="145" r="2" fill="#F59E0B" class="p2"/>

    <!-- Ascending Vector Rocket -->
    <g class="rocket-anim">
      <g transform="translate(675, 155)">
        <!-- Rocket Nose Cone & Fuselage -->
        <polygon points="0,-24 12,-2 0,-8 -12,-2" fill="#FDFBF7"/>
        <polygon points="0,-8 12,-2 12,12 0,6 -12,12 -12,-2" fill="#2563EB"/>
        <rect x="-5" y="-2" width="10" height="12" fill="#E11D48"/>
        <!-- Cockpit Window -->
        <circle cx="0" cy="-6" r="3" fill="#00F0FF"/>
        <!-- Left & Right Wing Stabilizers -->
        <polygon points="-12,6 -20,16 -12,14" fill="#00F0FF"/>
        <polygon points="12,6 20,16 12,14" fill="#00F0FF"/>
        <!-- Plasma Thruster Exhaust -->
        <polygon points="-8,14 -4,28 0,14" fill="#F59E0B"/>
        <polygon points="0,14 4,28 8,14" fill="#F59E0B"/>
        <polygon points="-3,14 0,34 3,14" fill="#E11D48"/>
      </g>
    </g>

    <!-- Sector Coordinates -->
    <text x="595" y="65" font-family="'JetBrains Mono', monospace" font-size="8.5px" fill="#71737E">GATEWAY::MERN_AIML</text>
    <text x="715" y="255" font-family="'JetBrains Mono', monospace" font-size="8.5px" fill="#71737E">LOC::MUMBAI_IN</text>
  </g>
</svg>
