<svg width="850" height="140" viewBox="0 0 850 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bh-bg       { fill: #111215; stroke: #2C303B; stroke-width: 1.5; }
      .tile-bg     { fill: #16171C; stroke: #2C303B; stroke-width: 1; }
      .stat-num    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 26px; font-weight: 800; fill: #FDFBF7; }
      .stat-tag    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; }
      .stat-desc   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #71737E; }

      @keyframes spinCompass {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes barDance1 { 0%, 100% { height: 6px; y: 12px; } 50% { height: 16px; y: 2px; } }
      @keyframes barDance2 { 0%, 100% { height: 14px; y: 4px; } 50% { height: 8px; y: 10px; } }
      @keyframes barDance3 { 0%, 100% { height: 10px; y: 8px; } 50% { height: 18px; y: 0px; } }

      .compass-spin { transform-origin: 225px 24px; animation: spinCompass 8s linear infinite; }
      .bar-1 { animation: barDance1 1.2s ease-in-out infinite; fill: #F59E0B; }
      .bar-2 { animation: barDance2 1.5s ease-in-out infinite; fill: #F59E0B; }
      .bar-3 { animation: barDance3 1.1s ease-in-out infinite; fill: #F59E0B; }
    </style>
  </defs>

  <rect width="850" height="140" rx="4" class="bh-bg"/>

  <!-- 3 Metric Plates -->
  <!-- Plate 1: Commits + Kinetic Compass -->
  <g transform="translate(24, 20)">
    <rect width="254" height="100" rx="2" class="tile-bg"/>
    <text x="18" y="24" class="stat-tag" style="fill:#2563EB;">PLATE 03-A // COMMITS</text>
    
    <!-- Rotating Compass on top right -->
    <g class="compass-spin">
      <circle cx="225" cy="24" r="8" fill="none" stroke="#2563EB" stroke-width="1.2"/>
      <line x1="225" y1="16" x2="225" y2="32" stroke="#E11D48" stroke-width="1.5"/>
      <line x1="217" y1="24" x2="233" y2="24" stroke="#F59E0B" stroke-width="1.5"/>
    </g>

    <text x="18" y="62" class="stat-num" style="color:#2563EB;">1,500+</text>
    <text x="18" y="84" class="stat-desc">REPOSITORIES PRODUCTION COMMITS</text>
  </g>

  <!-- Plate 2: Streak -->
  <g transform="translate(298, 20)">
    <rect width="254" height="100" rx="2" class="tile-bg"/>
    <text x="18" y="24" class="stat-tag" style="fill:#E11D48;">PLATE 03-B // RECORD</text>
    <circle cx="225" cy="22" r="4" fill="#E11D48"/>

    <text x="18" y="62" class="stat-num" style="color:#E11D48;">76+ DAYS</text>
    <text x="18" y="84" class="stat-desc">CONTINUOUS ACTIVE STREAK</text>
  </g>

  <!-- Plate 3: Domain -->
  <g transform="translate(572, 20)">
    <rect width="254" height="100" rx="2" class="tile-bg"/>
    <text x="18" y="24" class="stat-tag" style="fill:#F59E0B;">PLATE 03-C // DOMAIN</text>
    
    <!-- Dynamic Metric Bars -->
    <g transform="translate(215, 14)">
      <rect x="0" y="4" width="3" height="14" rx="1" class="bar-1"/>
      <rect x="5" y="8" width="3" height="10" rx="1" class="bar-2"/>
      <rect x="10" y="2" width="3" height="16" rx="1" class="bar-3"/>
    </g>

    <text x="18" y="62" class="stat-num" style="font-size:21px;">AI &amp; MERN</text>
    <text x="18" y="84" class="stat-desc">DETERMINISTIC ARCHITECTURE</text>
  </g>
</svg>
