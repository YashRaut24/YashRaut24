<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .console-bg  { fill: #08090C; stroke: #1E2638; stroke-width: 1.5; }
      .metric-box  { fill: #0E121A; stroke: #1E2638; stroke-width: 1; }
      .stat-num    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 26px; font-weight: 800; fill: #FFFFFF; }
      .stat-lbl    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #64748B; letter-spacing: 1.2px; }
      .stat-acc    { fill: #00F0FF; }
      .stat-purp   { fill: #A855F7; }
      .stat-amb    { fill: #F59E0B; }

      @keyframes eqBar1 { 0%, 100% { height: 6px; y: 14px; } 50% { height: 18px; y: 2px; } }
      @keyframes eqBar2 { 0%, 100% { height: 16px; y: 4px; } 50% { height: 8px; y: 12px; } }
      @keyframes eqBar3 { 0%, 100% { height: 10px; y: 10px; } 50% { height: 20px; y: 0px; } }
      @keyframes eqBar4 { 0%, 100% { height: 18px; y: 2px; } 50% { height: 6px; y: 14px; } }
      @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

      .eq-1 { animation: eqBar1 1.2s ease-in-out infinite; fill: #00F0FF; }
      .eq-2 { animation: eqBar2 1.4s ease-in-out infinite; fill: #00F0FF; }
      .eq-3 { animation: eqBar3 1.1s ease-in-out infinite; fill: #A855F7; }
      .eq-4 { animation: eqBar4 1.5s ease-in-out infinite; fill: #A855F7; }
      .beacon-dot { animation: pulseGlow 1.5s infinite; }
    </style>
  </defs>

  <rect width="850" height="150" rx="8" class="console-bg"/>

  <!-- 3 Metric Cards: Width 254 each, Gap 14 -->
  <!-- Card 1: Contributions + Equalizer Pulse -->
  <g transform="translate(22, 20)">
    <rect width="254" height="110" rx="6" class="metric-box"/>
    <text x="18" y="26" class="stat-lbl">01 // REPOSITORY COMMITS</text>
    
    <!-- Mini Equalizer bars on top right of card -->
    <g transform="translate(210, 14)">
      <rect x="0" y="4" width="3.5" height="16" rx="1.5" class="eq-1"/>
      <rect x="6" y="8" width="3.5" height="12" rx="1.5" class="eq-2"/>
      <rect x="12" y="2" width="3.5" height="18" rx="1.5" class="eq-3"/>
      <rect x="18" y="6" width="3.5" height="14" rx="1.5" class="eq-4"/>
    </g>

    <text x="18" y="66" class="stat-num stat-acc">1,500+</text>
    <text x="18" y="90" class="stat-lbl" style="color:#94A3B8;">ACTIVE PRODUCTION COMMITS</text>
  </g>

  <!-- Card 2: Streak -->
  <g transform="translate(298, 20)">
    <rect width="254" height="110" rx="6" class="metric-box"/>
    <text x="18" y="26" class="stat-lbl" style="fill:#A855F7;">02 // COMMIT STREAK</text>
    <circle cx="225" cy="22" r="3.5" fill="#A855F7" class="beacon-dot"/>

    <text x="18" y="66" class="stat-num stat-purp">76+ DAYS</text>
    <text x="18" y="90" class="stat-lbl" style="color:#94A3B8;">CONTINUOUS ACTIVE RECORD</text>
  </g>

  <!-- Card 3: System Rigor -->
  <g transform="translate(574, 20)">
    <rect width="254" height="110" rx="6" class="metric-box"/>
    <text x="18" y="26" class="stat-lbl" style="fill:#F59E0B;">03 // SYSTEM DOMAIN</text>
    <circle cx="225" cy="22" r="3.5" fill="#F59E0B" class="beacon-dot"/>

    <text x="18" y="66" class="stat-num stat-amb" style="font-size:22px;">AI &amp; MERN</text>
    <text x="18" y="90" class="stat-lbl" style="color:#94A3B8;">DETERMINISTIC ARCHITECTURE</text>
  </g>
</svg>
