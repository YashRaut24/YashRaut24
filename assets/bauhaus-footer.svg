<svg width="850" height="50" viewBox="0 0 850 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bh-foot   { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; fill: #71737E; letter-spacing: 1.2px; }
      .foot-red  { fill: #E11D48; font-weight: 700; }
      .foot-blue { fill: #2563EB; font-weight: 700; }
      .border    { stroke: #2C303B; stroke-width: 1; }
    </style>
  </defs>

  <line x1="0" y1="25" x2="210" y2="25" class="border"/>
  <line x1="640" y1="25" x2="850" y2="25" class="border"/>

  <rect x="220" y="8" width="410" height="34" rx="2" fill="#111215" stroke="#2C303B" stroke-width="1"/>
  
  <!-- Geometric Bauhaus marks inside footer -->
  <rect x="235" y="20" width="10" height="10" fill="#E11D48"/>
  <circle cx="258" cy="25" r="5" fill="#2563EB"/>
  <polygon points="270,30 275,20 280,30" fill="#F59E0B"/>

  <text x="460" y="29" text-anchor="middle" class="bh-foot">
    STAATLICHES DEV-FABRIQUE // <tspan class="foot-red">YASH RAUT</tspan> • <tspan class="foot-blue">2026</tspan>
  </text>
</svg>
