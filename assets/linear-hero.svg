<svg width="850" height="190" viewBox="0 0 850 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .badge-bg    { fill: #12151B; stroke: #222733; stroke-width: 1; }
      .badge-txt   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: #5E6AD2; letter-spacing: 1.2px; }
      .hero-name   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; font-weight: 800; font-size: 46px; letter-spacing: -1.5px; fill: #F7F8F8; }
      .hero-tag    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 400; font-size: 16px; fill: #8A8F98; letter-spacing: -0.2px; }
      .status-txt  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: #10B981; }
      .meta-txt    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11.5px; fill: #62666D; }
      .meta-val    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #D0D6E0; }
    </style>
  </defs>

  <!-- Canvas Surface -->
  <rect width="850" height="190" rx="10" fill="#08090A" stroke="#1F242C" stroke-width="1"/>

  <!-- Top Badge + Status Row -->
  <g transform="translate(36, 28)">
    <rect width="210" height="26" rx="13" class="badge-bg"/>
    <text x="14" y="17" class="badge-txt">AI &amp; FULL-STACK ENGINEER</text>

    <!-- Status Indicator Right-Aligned -->
    <g transform="translate(620, 0)">
      <rect width="158" height="26" rx="13" fill="#0E1E17" stroke="#133E2B" stroke-width="1"/>
      <circle cx="16" cy="13" r="3.5" fill="#10B981"/>
      <text x="28" y="17" class="status-txt">AVAILABLE TO BUILD</text>
    </g>
  </g>

  <!-- Hero Name & Dynamic Tagline -->
  <g transform="translate(36, 96)">
    <text x="0" y="0" class="hero-name">Yash Raut</text>
    <text x="0" y="30" class="hero-tag">Engineering autonomous AI systems, RAG workflows &amp; high-performance backends.</text>
  </g>

  <!-- Bottom Metadata Strip -->
  <g transform="translate(36, 160)">
    <text x="0" y="0" class="meta-txt">LOCATION:</text>
    <text x="68" y="0" class="meta-val">Mumbai, India</text>

    <circle cx="180" cy="-4" r="2" fill="#2E3440"/>

    <text x="200" y="0" class="meta-txt">TIMEZONE:</text>
    <text x="272" y="0" class="meta-val">IST (UTC +5:30)</text>

    <circle cx="390" cy="-4" r="2" fill="#2E3440"/>

    <text x="410" y="0" class="meta-txt">FOCUS:</text>
    <text x="460" y="0" class="meta-val" style="fill:#5E6AD2;">Multi-Agent Systems &amp; MERN</text>
  </g>
</svg>
