<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-bg     { fill: #121316; stroke: #2A2C33; stroke-width: 1.5; }
      .article-box { fill: #191B1F; stroke: #2A2C33; stroke-width: 1; }
      .article-tag { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #E06C43; letter-spacing: 1.2px; }
      .article-h   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 17px; font-weight: 800; fill: #FBFBFC; letter-spacing: -0.3px; }
      .article-p   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 12px; font-weight: 400; fill: #A1A1AA; line-height: 18px; }
      .pill-text   { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #D4D4D8; }
      .pill-box    { fill: #23252B; stroke: #363842; stroke-width: 1; }
      .num-stat    { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 800; fill: #E06C43; }
      .num-lbl     { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #71717A; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect width="900" height="320" rx="6" class="card-bg"/>

  <!-- 3 Editorial Columns: Width 272 each, Gap 14, Total ~844 -->
  
  <!-- Column 1: AI & AGENTS -->
  <g transform="translate(24, 24)">
    <rect width="268" height="272" rx="4" class="article-box"/>
    
    <g transform="translate(18, 22)">
      <text x="0" y="0" class="article-tag">SECTION I // AI SYSTEMS</text>
      <text x="0" y="28" class="article-h">Autonomous Workflows</text>
      
      <text x="0" y="58" class="article-p">Orchestrating multi-agent systems</text>
      <text x="0" y="76" class="article-p">with LangChain, structured output</text>
      <text x="0" y="94" class="article-p">validation, ChromaDB vector search,</text>
      <text x="0" y="112" class="article-p">and sub-second Groq inference.</text>

      <!-- Sub-Pills -->
      <g transform="translate(0, 138)">
        <rect x="0" y="0" width="105" height="22" rx="3" class="pill-box"/>
        <text x="8" y="15" class="pill-text">01. RAG RETRIEVAL</text>

        <rect x="115" y="0" width="112" height="22" rx="3" class="pill-box"/>
        <text x="123" y="15" class="pill-text">02. TOOL CALLING</text>

        <rect x="0" y="30" width="132" height="22" rx="3" class="pill-box"/>
        <text x="8" y="45" class="pill-text">03. VECTOR EMBEDDING</text>
      </g>
    </g>
  </g>

  <!-- Column 2: FULL-STACK ENGINE -->
  <g transform="translate(306, 24)">
    <rect width="268" height="272" rx="4" class="article-box"/>

    <g transform="translate(18, 22)">
      <text x="0" y="0" class="article-tag" style="fill:#F59E0B;">SECTION II // ARCHITECTURE</text>
      <text x="0" y="28" class="article-h">Distributed Full-Stack</text>
      
      <text x="0" y="58" class="article-p">Engineering modular backend APIs</text>
      <text x="0" y="76" class="article-p">in Node.js &amp; FastAPI. Constructing</text>
      <text x="0" y="94" class="article-p">high-responsiveness React/Next.js</text>
      <text x="0" y="112" class="article-p">interfaces with clean type safety.</text>

      <!-- Sub-Pills -->
      <g transform="translate(0, 138)">
        <rect x="0" y="0" width="112" height="22" rx="3" class="pill-box"/>
        <text x="8" y="15" class="pill-text">01. FASTAPI &amp; NODE</text>

        <rect x="122" y="0" width="105" height="22" rx="3" class="pill-box"/>
        <text x="130" y="15" class="pill-text">02. NEXT.js / SSR</text>

        <rect x="0" y="30" width="128" height="22" rx="3" class="pill-box"/>
        <text x="8" y="45" class="pill-text">03. POSTGRES &amp; MONGO</text>
      </g>
    </g>
  </g>

  <!-- Column 3: TELEMETRY & METRICS -->
  <g transform="translate(588, 24)">
    <rect width="288" height="272" rx="4" class="article-box"/>

    <g transform="translate(20, 22)">
      <text x="0" y="0" class="article-tag" style="fill:#D4D4D8;">SECTION III // SPECS</text>
      <text x="0" y="28" class="article-h">Operational Telemetry</text>
      
      <text x="0" y="58" class="article-p">Committed to deterministic code quality,</text>
      <text x="0" y="76" class="article-p">minimal latency, and clean architecture.</text>

      <!-- 3 Numerical Callout Blocks -->
      <g transform="translate(0, 106)">
        <rect x="0" y="0" width="248" height="38" rx="3" class="pill-box"/>
        <text x="12" y="26" class="num-stat">100%</text>
        <text x="90" y="24" class="num-lbl">CODE ARCHITECTURAL RIGOR</text>

        <rect x="0" y="46" width="248" height="38" rx="3" class="pill-box"/>
        <text x="12" y="72" class="num-stat">&lt;50ms</text>
        <text x="90" y="70" class="num-lbl">TARGET INFERENCE LATENCY</text>

        <rect x="0" y="92" width="248" height="38" rx="3" class="pill-box"/>
        <text x="12" y="118" class="num-stat" style="font-size:18px;">ACTIVE</text>
        <text x="90" y="116" class="num-lbl">STATUS: READY TO SHIP</text>
      </g>
    </g>
  </g>
</svg>
