<svg width="850" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg-panel   { fill: #08090C; stroke: #1E2638; stroke-width: 1.5; }
      .tag-chip   { fill: #131926; stroke: #26334D; stroke-width: 1; }
      .tag-txt    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #00F0FF; letter-spacing: 1.5px; }
      .name-main  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; font-weight: 900; font-size: 50px; letter-spacing: -1.5px; fill: #FFFFFF; }
      .name-sub   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 400; font-size: 15px; fill: #94A3B8; }
      .hud-lbl    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #64748B; letter-spacing: 1px; }
      .hud-val    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #F1F5F9; }
      .corner-crs { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #00F0FF; font-weight: bold; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="850" height="220" rx="8" class="bg-panel"/>

  <!-- Corner Crosshairs -->
  <text x="14" y="22" class="corner-crs">+</text>
  <text x="826" y="22" class="corner-crs">+</text>
  <text x="14" y="210" class="corner-crs">+</text>
  <text x="826" y="210" class="corner-crs">+</text>

  <!-- Top Metadata Header -->
  <g transform="translate(36, 26)">
    <rect width="210" height="24" rx="4" class="tag-chip"/>
    <text x="12" y="16" class="tag-txt">SYS_ID // YR-AI-2026</text>

    <!-- Radar Live Status -->
    <g transform="translate(610, 0)">
      <rect width="168" height="24" rx="12" fill="#0C2016" stroke="#059669" stroke-width="1"/>
      <circle cx="14" cy="12" r="3.5" fill="#10B981"/>
      <text x="26" y="16" font-family="'JetBrains Mono', monospace" font-size="10.5px" font-weight="700" fill="#10B981" letter-spacing="0.8px">STATUS: OPERATIONAL</text>
    </g>
  </g>

  <!-- Hero Identity -->
  <g transform="translate(36, 98)">
    <text x="0" y="0" class="name-main">YASH RAUT</text>
    <text x="0" y="28" class="name-sub">AI Systems Engineer &amp; Full-Stack Architect // LLM Orchestration • RAG • Distributed APIs</text>
  </g>

  <!-- Bottom Telemetry HUD -->
  <line x1="36" y1="156" x2="814" y2="156" stroke="#1E2638" stroke-width="1"/>
  
  <g transform="translate(36, 186)">
    <text x="0" y="0" class="hud-lbl">ORIGIN:</text>
    <text x="56" y="0" class="hud-val">Mumbai, India</text>

    <circle cx="160" cy="-4" r="2" fill="#334155"/>

    <text x="180" y="0" class="hud-lbl">TIMEZONE:</text>
    <text x="248" y="0" class="hud-val">Asia/Kolkata (IST)</text>

    <circle cx="370" cy="-4" r="2" fill="#334155"/>

    <text x="390" y="0" class="hud-lbl">EXPERTISE:</text>
    <text x="462" y="0" class="hud-val" style="fill:#00F0FF;">AI Agents &amp; MERN Stack</text>

    <circle cx="640" cy="-4" r="2" fill="#334155"/>

    <text x="660" y="0" class="hud-lbl">AVAILABILITY:</text>
    <text x="754" y="0" class="hud-val" style="fill:#10B981;">Ready to Build</text>
  </g>
</svg>
