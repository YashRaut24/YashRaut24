<svg width="900" height="70" viewBox="0 0 900 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .txt       { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 12px; font-weight: 500; fill: #64748B; letter-spacing: 1px; }
      .highlight { fill: #38BDF8; font-weight: 600; }
      .border    { stroke: #1E293B; stroke-width: 1; }
    </style>
  </defs>

  <line x1="0" y1="35" x2="300" y2="35" class="border"/>
  <line x1="600" y1="35" x2="900" y2="35" class="border"/>

  <rect x="310" y="18" width="280" height="34" rx="17" fill="#0B0F17" stroke="#232D3F" stroke-width="1"/>
  <circle cx="330" cy="35" r="3" fill="#38BDF8"/>
  <text x="450" y="39" text-anchor="middle" class="txt">CRAFTED WITH <tspan class="highlight">PRECISION</tspan> • 2026</text>
  <circle cx="570" cy="35" r="3" fill="#38BDF8"/>
</svg>
