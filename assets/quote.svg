<svg width="900" height="150" viewBox="0 0 900 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-bg   { fill: #0B0F17; }
      .border    { stroke: #232D3F; stroke-width: 1; }
      .quote-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', serif; font-style: italic; font-size: 19px; fill: #F1F5F9; letter-spacing: 0.2px; }
      .author    { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #38BDF8; letter-spacing: 0.5px; }
      .tag       { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #64748B; }
      .quote-mark{ font-family: Georgia, serif; font-size: 52px; fill: #1E293B; }
    </style>
  </defs>

  <rect width="900" height="150" rx="10" class="card-bg"/>
  <rect width="900" height="150" rx="10" class="border" fill="none"/>

  <!-- Left Accent Line -->
  <rect x="36" y="32" width="3" height="86" rx="1.5" fill="#38BDF8"/>

  <!-- Quote Mark Icon background -->
  <text x="56" y="66" class="quote-mark">“</text>

  <!-- Quote Content -->
  <text x="64" y="64" class="quote-txt">Programs must be written for people to read,</text>
  <text x="64" y="92" class="quote-txt">and only incidentally for machines to execute.</text>

  <!-- Author Attribution -->
  <text x="64" y="122" class="author">— Harold Abelson</text>
  <text x="230" y="122" class="tag">Structure and Interpretation of Computer Programs</text>
</svg>
