<svg width="900" height="150" viewBox="0 0 900 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-bg    { fill: #121316; }
      .border     { stroke: #2A2C33; stroke-width: 1.5; }
      .quote-text { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 19.5px; fill: #FBFBFC; letter-spacing: 0.2px; }
      .author     { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; fill: #E06C43; letter-spacing: 0.5px; }
      .cite       { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #71717A; }
      .quote-mark { font-family: 'Playfair Display', Georgia, serif; font-size: 56px; fill: #2A2C33; font-weight: bold; }
    </style>
  </defs>

  <rect width="900" height="150" rx="6" class="card-bg"/>
  <rect width="900" height="150" rx="6" class="border" fill="none"/>

  <!-- Left Terracotta Rule -->
  <rect x="32" y="26" width="3" height="98" rx="1" fill="#E06C43"/>

  <!-- Quote Mark -->
  <text x="52" y="66" class="quote-mark">“</text>

  <!-- Quote Lines -->
  <text x="60" y="64" class="quote-text">Programs must be written for people to read,</text>
  <text x="60" y="92" class="quote-text">and only incidentally for machines to execute.</text>

  <!-- Author Attribution -->
  <text x="60" y="122" class="author">— Harold Abelson</text>
  <text x="210" y="122" class="cite">// Structure and Interpretation of Computer Programs</text>
</svg>
