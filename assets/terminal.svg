<svg width="620" height="340" viewBox="0 0 620 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .win-bg    { fill: #121316; }
      .bar-bg    { fill: #191B1F; }
      .border    { stroke: #2A2C33; stroke-width: 1.5; }
      .title     { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #71717A; letter-spacing: 0.5px; }
      .code      { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
      .kw        { fill: #E06C43; font-weight: bold; }
      .fn        { fill: #F59E0B; }
      .prop      { fill: #A1A1AA; }
      .str       { fill: #D4D4D8; }
      .bool      { fill: #E06C43; }
      .punct     { fill: #52525B; }
      .cmd       { fill: #FBFBFC; font-weight: 600; }
      .cursor    { fill: #E06C43; }
    </style>
  </defs>

  <rect width="620" height="340" rx="6" class="win-bg"/>
  <rect width="620" height="340" rx="6" class="border" fill="none"/>

  <!-- Top Bar -->
  <path d="M0 6C0 2.68629 2.68629 0 6 0H614C617.314 0 620 2.68629 620 6V34H0V6Z" class="bar-bg"/>
  <line x1="0" y1="34" x2="620" y2="34" stroke="#2A2C33" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="20" cy="17" r="4" fill="#363842"/>
  <circle cx="34" cy="17" r="4" fill="#363842"/>
  <circle cx="48" cy="17" r="4" fill="#363842"/>

  <text x="310" y="21" text-anchor="middle" class="title">yash@editorial-dispatch: ~/curriculum.log</text>

  <!-- Content -->
  <g transform="translate(24, 60)">
    <text x="0" y="0" class="code">
      <tspan class="kw">§ </tspan><tspan class="fn">dispatch </tspan><tspan class="cmd">--inspect-dossier</tspan>
    </text>

    <text x="0" y="28" class="code punct">[2026.08] CURRICULUM VITAE INITIALIZED // READY</text>

    <text x="0" y="56" class="code">
      <tspan class="prop">engineer</tspan><tspan class="punct">: </tspan><tspan class="str">"Yash Raut"</tspan><tspan class="punct">,</tspan>
    </text>
    <text x="0" y="82" class="code">
      <tspan class="prop">specialization</tspan><tspan class="punct">: </tspan><tspan class="str">"AI Engineering &amp; Distributed Systems"</tspan><tspan class="punct">,</tspan>
    </text>
    <text x="0" y="108" class="code">
      <tspan class="prop">coreStack</tspan><tspan class="punct">: [</tspan><tspan class="str">"LLMs"</tspan><tspan class="punct">, </tspan><tspan class="str">"LangChain"</tspan><tspan class="punct">, </tspan><tspan class="str">"FastAPI"</tspan><tspan class="punct">, </tspan><tspan class="str">"MERN"</tspan><tspan class="punct">],</tspan>
    </text>
    <text x="0" y="134" class="code">
      <tspan class="prop">methodology</tspan><tspan class="punct">: </tspan><tspan class="str">"Deterministic &amp; Modular Architecture"</tspan><tspan class="punct">,</tspan>
    </text>
    <text x="0" y="160" class="code">
      <tspan class="prop">availableForBuild</tspan><tspan class="punct">: </tspan><tspan class="bool">true</tspan>
    </text>

    <!-- Prompt line -->
    <text x="0" y="200" class="code">
      <tspan class="kw">§ </tspan><tspan class="fn">git </tspan><tspan class="cmd">commit -m "architecting the future"</tspan>
    </text>

    <!-- Cursor -->
    <rect x="366" y="188" width="7" height="15" class="cursor">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
