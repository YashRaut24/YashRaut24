<svg width="850" height="230" viewBox="0 0 850 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bh-bg       { fill: #111215; stroke: #2C303B; stroke-width: 1.5; }
      .tag-txt     { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #FDFBF7; letter-spacing: 1.5px; }
      .sub-txt     { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; fill: #71737E; letter-spacing: 1px; }
      .axis-lbl    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; fill: #52545F; }
      .stat-lbl    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; fill: #71737E; }

      /* Kinetic Audio Frequency Oscillations */
      @keyframes eqPulse1 {
        0%, 100% { height: 16px; y: 74px; }
        50%      { height: 68px; y: 22px; }
      }
      @keyframes eqPulse2 {
        0%, 100% { height: 54px; y: 36px; }
        50%      { height: 20px; y: 70px; }
      }
      @keyframes eqPulse3 {
        0%, 100% { height: 32px; y: 58px; }
        50%      { height: 84px; y: 6px; }
      }
      @keyframes eqPulse4 {
        0%, 100% { height: 72px; y: 18px; }
        50%      { height: 28px; y: 62px; }
      }
      @keyframes eqPulsePeak {
        0%, 100% { height: 40px; y: 50px; }
        50%      { height: 94px; y: -4px; }
      }
      @keyframes sineDash {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -300; }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.2; }
      }

      .f-1    { animation: eqPulse1 1.4s ease-in-out infinite; }
      .f-2    { animation: eqPulse2 1.8s ease-in-out infinite; }
      .f-3    { animation: eqPulse3 1.2s ease-in-out infinite; }
      .f-4    { animation: eqPulse4 1.6s ease-in-out infinite; }
      .f-peak { animation: eqPulsePeak 1.1s ease-in-out infinite; }
      .wave-line { stroke-dasharray: 8 4; animation: sineDash 6s linear infinite; }
      .live-dot  { animation: beaconBlink 1s steps(2, start) infinite; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="850" height="230" rx="4" class="bh-bg"/>

  <!-- Top Title Bar -->
  <g transform="translate(24, 22)">
    <circle cx="0" cy="5" r="3.5" fill="#E11D48" class="live-dot"/>
    <text x="14" y="9" class="tag-txt">PLATE 03 // KINETIC COMMIT OSCILLOSCOPE &amp; AUDIO WAVE</text>
    <text x="530" y="9" class="sub-txt">[52-WEEK COMMIT HARMONICS // LIVE]</text>
  </g>
  <line x1="0" y1="42" x2="850" y2="42" stroke="#2C303B" stroke-width="1"/>

  <!-- Frequency Grid Area (52 Vertical Channels) -->
  <g transform="translate(36, 60)">
    
    <!-- Frequency Amplitude Guideline axes -->
    <line x1="0" y1="0" x2="778" y2="0" stroke="#1F232E" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="0" y1="30" x2="778" y2="30" stroke="#1F232E" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="0" y1="60" x2="778" y2="60" stroke="#1F232E" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="0" y1="90" x2="778" y2="90" stroke="#2C303B" stroke-width="1.5"/>

    <!-- 52 Kinetic Frequency Bars (Step X = 15, Width 8) -->
    <!-- JAN -->
    <rect x="0" y="70" width="8" height="20" rx="1.5" fill="#1E3A8A" class="f-1"/>
    <rect x="15" y="60" width="8" height="30" rx="1.5" fill="#2563EB" class="f-2"/>
    <rect x="30" y="45" width="8" height="45" rx="1.5" fill="#2563EB" class="f-3"/>
    <rect x="45" y="30" width="8" height="60" rx="1.5" fill="#E11D48" class="f-4"/>

    <!-- FEB -->
    <rect x="60" y="50" width="8" height="40" rx="1.5" fill="#2563EB" class="f-1"/>
    <rect x="75" y="35" width="8" height="55" rx="1.5" fill="#E11D48" class="f-3"/>
    <rect x="90" y="20" width="8" height="70" rx="1.5" fill="#F59E0B" class="f-peak"/>
    <rect x="105" y="40" width="8" height="50" rx="1.5" fill="#2563EB" class="f-2"/>

    <!-- MAR -->
    <rect x="120" y="55" width="8" height="35" rx="1.5" fill="#2563EB" class="f-4"/>
    <rect x="135" y="25" width="8" height="65" rx="1.5" fill="#E11D48" class="f-1"/>
    <rect x="150" y="45" width="8" height="45" rx="1.5" fill="#2563EB" class="f-3"/>
    <rect x="165" y="30" width="8" height="60" rx="1.5" fill="#E11D48" class="f-2"/>

    <!-- APR -->
    <rect x="180" y="60" width="8" height="30" rx="1.5" fill="#1E3A8A" class="f-1"/>
    <rect x="195" y="20" width="8" height="70" rx="1.5" fill="#F59E0B" class="f-peak"/>
    <rect x="210" y="40" width="8" height="50" rx="1.5" fill="#2563EB" class="f-3"/>
    <rect x="225" y="25" width="8" height="65" rx="1.5" fill="#E11D48" class="f-4"/>

    <!-- MAY -->
    <rect x="240" y="50" width="8" height="40" rx="1.5" fill="#2563EB" class="f-2"/>
    <rect x="255" y="15" width="8" height="75" rx="1.5" fill="#F59E0B" class="f-peak"/>
    <rect x="270" y="35" width="8" height="55" rx="1.5" fill="#E11D48" class="f-1"/>
    <rect x="285" y="55" width="8" height="35" rx="1.5" fill="#2563EB" class="f-3"/>

    <!-- JUN -->
    <rect x="300" y="40" width="8" height="50" rx="1.5" fill="#2563EB" class="f-4"/>
    <rect x="315" y="20" width="8" height="70" rx="1.5" fill="#E11D48" class="f-1"/>
    <rect x="330" y="10" width="8" height="80" rx="1.5" fill="#F59E0B" class="f-peak"/>
    <rect x="345" y="30" width="8" height="60" rx="1.5" fill="#E11D48" class="f-2"/>

    <!-- JUL -->
    <rect x="360" y="45" width="8" height="45" rx="1.5" fill="#2563EB" class="f-3"/>
    <rect x="375" y="15" width="8" height="75" rx="1.5" fill="#F59E0B" class="f-peak"/>
    <rect x="390" y="25" width="8" height="65" rx="1.5" fill="#E11D48" class="f-1"/>
    <rect x="405" y="50" width="8" height="40" rx="1.5" fill="#2563EB" class="f-4"/>

    <!-- AUG (PEAK RECORD) -->
    <rect x="420" y="20" width="8" height="70" rx="1.5" fill="#E11D48" class="f-2"/>
    <rect x="435" y="5" width="8" height="85" rx="1.5" fill="#F59E0B" class="f-peak"/>
    <rect x="450" y="0" width="8" height="90" rx="1.5" fill="#FDFBF7" class="f-peak"/>
    <rect x="465" y="15" width="8" height="75" rx="1.5" fill="#F59E0B" class="f-peak"/>

    <!-- SEP -->
    <rect x="480" y="35" width="8" height="55" rx="1.5" fill="#E11D48" class="f-1"/>
    <rect x="495" y="50" width="8" height="40" rx="1.5" fill="#2563EB" class="f-3"/>
    <rect x="510" y="25" width="8" height="65" rx="1.5" fill="#E11D48" class="f-2"/>
    <rect x="525" y="60" width="8" height="30" rx="1.5" fill="#1E3A8A" class="f-4"/>

    <!-- OCT -->
    <rect x="540" y="40" width="8" height="50" rx="1.5" fill="#2563EB" class="f-1"/>
    <rect x="555" y="15" width="8" height="75" rx="1.5" fill="#F59E0B" class="f-peak"/>
    <rect x="570" y="30" width="8" height="60" rx="1.5" fill="#E11D48" class="f-3"/>
    <rect x="585" y="45" width="8" height="45" rx="1.5" fill="#2563EB" class="f-2"/>

    <!-- NOV -->
    <rect x="600" y="55" width="8" height="35" rx="1.5" fill="#2563EB" class="f-4"/>
    <rect x="615" y="25" width="8" height="65" rx="1.5" fill="#E11D48" class="f-1"/>
    <rect x="630" y="35" width="8" height="55" rx="1.5" fill="#E11D48" class="f-3"/>
    <rect x="645" y="15" width="8" height="75" rx="1.5" fill="#F59E0B" class="f-peak"/>

    <!-- DEC -->
    <rect x="660" y="40" width="8" height="50" rx="1.5" fill="#2563EB" class="f-2"/>
    <rect x="675" y="30" width="8" height="60" rx="1.5" fill="#E11D48" class="f-4"/>
    <rect x="690" y="50" width="8" height="40" rx="1.5" fill="#2563EB" class="f-1"/>
    <rect x="705" y="65" width="8" height="25" rx="1.5" fill="#1E3A8A" class="f-3"/>
    <rect x="720" y="45" width="8" height="45" rx="1.5" fill="#2563EB" class="f-2"/>
    <rect x="735" y="35" width="8" height="55" rx="1.5" fill="#E11D48" class="f-1"/>
    <rect x="750" y="20" width="8" height="70" rx="1.5" fill="#F59E0B" class="f-peak"/>
    <rect x="765" y="55" width="8" height="35" rx="1.5" fill="#2563EB" class="f-4"/>

    <!-- Continuous Oscilloscope Kinetic Wave Overlay -->
    <path d="M0,60 Q30,10 60,60 T120,60 T180,30 T240,60 T300,20 T360,60 T420,10 T480,60 T540,30 T600,60 T660,20 T720,60 T778,40" 
          fill="none" stroke="#FDFBF7" stroke-width="1.8" class="wave-line" opacity="0.8"/>

    <!-- Date Axis Labels -->
    <g transform="translate(0, 108)">
      <text x="0" y="0" class="axis-lbl">JAN</text>
      <text x="64" y="0" class="axis-lbl">FEB</text>
      <text x="128" y="0" class="axis-lbl">MAR</text>
      <text x="192" y="0" class="axis-lbl">APR</text>
      <text x="256" y="0" class="axis-lbl">MAY</text>
      <text x="320" y="0" class="axis-lbl">JUN</text>
      <text x="384" y="0" class="axis-lbl">JUL</text>
      <text x="448" y="0" class="axis-lbl">AUG</text>
      <text x="512" y="0" class="axis-lbl">SEP</text>
      <text x="576" y="0" class="axis-lbl">OCT</text>
      <text x="640" y="0" class="axis-lbl">NOV</text>
      <text x="704" y="0" class="axis-lbl">DEC</text>
    </g>
  </g>

  <!-- Legend & Live Signal Metrics -->
  <g transform="translate(36, 198)">
    <rect x="0" y="0" width="8" height="8" rx="1.5" fill="#1E3A8A"/>
    <text x="14" y="8" class="stat-lbl">LOW HARMONIC</text>

    <rect x="110" y="0" width="8" height="8" rx="1.5" fill="#2563EB"/>
    <text x="124" y="8" class="stat-lbl">ACTIVE FREQ</text>

    <rect x="210" y="0" width="8" height="8" rx="1.5" fill="#E11D48"/>
    <text x="224" y="8" class="stat-lbl">HIGH RESONANCE</text>

    <rect x="330" y="0" width="8" height="8" rx="1.5" fill="#F59E0B"/>
    <text x="344" y="8" class="stat-lbl" style="fill:#F59E0B; font-weight:bold;">PEAK VELOCITY</text>

    <text x="600" y="8" font-family="'JetBrains Mono', monospace" font-size="10.5px" font-weight="700" fill="#2563EB">SIGNAL: 1,500+ COMMITS [OK]</text>
  </g>
</svg>
