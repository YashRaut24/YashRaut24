<svg width="900" height="150" viewBox="0 0 900 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-bg   { fill: #121316; }
      .border    { stroke: #2A2C33; stroke-width: 1.5; }
      .title     { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 14.5px; font-weight: 800; fill: #FBFBFC; letter-spacing: 0.5px; }
      .desc      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 12.5px; font-weight: 400; fill: #A1A1AA; line-height: 18px; }
      .axiom-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #E06C43; letter-spacing: 1px; }
      .col-box   { fill: #191B1F; stroke: #2A2C33; stroke-width: 1; }
    </style>
  </defs>

  <!-- 3 Columns: Width 288 each, Gap 12 -->
  
  <!-- Axiom 01: MODULARITY -->
  <g transform="translate(0, 0)">
    <rect width="288" height="150" rx="6" class="col-box"/>
    <text x="24" y="32" class="axiom-num">AXIOM 01 // ARCHITECTURE</text>
    <text x="24" y="58" class="title">Modularity &amp; Decoupling</text>
    <text x="24" y="88" class="desc">Systems constructed as deterministic,</text>
    <text x="24" y="108" class="desc">isolated units with strict contract schemas.</text>
  </g>

  <!-- Axiom 02: INTENTIONALITY -->
  <g transform="translate(306, 0)">
    <rect width="288" height="150" rx="6" class="col-box"/>
    <text x="24" y="32" class="axiom-num" style="fill:#F59E0B;">AXIOM 02 // RIGOR</text>
    <text x="24" y="58" class="title">Computational Intent</text>
    <text x="24" y="88" class="desc">Every abstraction and pipeline layer</text>
    <text x="24" y="108" class="desc">must justify its execution latency.</text>
  </g>

  <!-- Axiom 03: PRODUCT DELIGHT -->
  <g transform="translate(612, 0)">
    <rect width="288" height="150" rx="6" class="col-box"/>
    <text x="24" y="32" class="axiom-num" style="fill:#D4D4D8;">AXIOM 03 // CRAFT</text>
    <text x="24" y="58" class="title">Human-Centric Design</text>
    <text x="24" y="88" class="desc">Engineering for friction-free developer</text>
    <text x="24" y="108" class="desc">and end-user digital experiences.</text>
  </g>
</svg>
