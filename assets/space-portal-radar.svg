<svg width="130" height="130" viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes blipPing1 {
        0%, 30%   { opacity: 0; transform: scale(0.3); }
        35%, 65%  { opacity: 1; transform: scale(1); }
        70%, 100% { opacity: 0; transform: scale(0.3); }
      }
      @keyframes blipPing2 {
        0%, 55%   { opacity: 0; transform: scale(0.3); }
        60%, 85%  { opacity: 1; transform: scale(1); }
        90%, 100% { opacity: 0; transform: scale(0.3); }
      }

      .sweep-beam { animation: radarSweep 4s linear infinite; transform-origin: 65px 65px; }
      .blip1      { animation: blipPing1 4s ease-out infinite; transform-origin: 85px 45px; }
      .blip2      { animation: blipPing2 4s ease-out infinite; transform-origin: 45px 80px; }
    </style>
  </defs>

  <!-- Radar Rings -->
  <circle cx="65" cy="65" r="58" fill="#111216" stroke="#1F2430" stroke-width="1.5"/>
  <circle cx="65" cy="65" r="42" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="65" cy="65" r="26" fill="none" stroke="#1F2430" stroke-width="1"/>
  <circle cx="65" cy="65" r="10" fill="none" stroke="#1F2430" stroke-width="1"/>
  <circle cx="65" cy="65" r="3" fill="#00F0FF"/>

  <!-- Crosshairs -->
  <line x1="7" y1="65" x2="123" y2="65" stroke="#1F2430" stroke-width="1"/>
  <line x1="65" y1="7" x2="65" y2="123" stroke="#1F2430" stroke-width="1"/>

  <!-- Rotating Radar Sweep Beam -->
  <g class="sweep-beam">
    <line x1="65" y1="65" x2="65" y2="7" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
    <polygon points="65,65 58,7 65,7" fill="#00F0FF" opacity="0.3"/>
  </g>

  <!-- Radar Blip Pings -->
  <g class="blip1">
    <circle cx="85" cy="45" r="3" fill="#39D353"/>
    <circle cx="85" cy="45" r="6" fill="none" stroke="#39D353" stroke-width="1"/>
  </g>
  <g class="blip2">
    <circle cx="45" cy="80" r="3" fill="#00F0FF"/>
    <circle cx="45" cy="80" r="6" fill="none" stroke="#00F0FF" stroke-width="1"/>
  </g>

  <!-- Cardinal Coordinates -->
  <text x="61" y="20" font-family="'JetBrains Mono', monospace" font-size="8px" font-weight="700" fill="#00F0FF">0°</text>
  <text x="110" y="68" font-family="'JetBrains Mono', monospace" font-size="8px" font-weight="700" fill="#71737E">90°</text>
  <text x="56" y="118" font-family="'JetBrains Mono', monospace" font-size="8px" font-weight="700" fill="#71737E">180°</text>
  <text x="12" y="68" font-family="'JetBrains Mono', monospace" font-size="8px" font-weight="700" fill="#71737E">270°</text>
</svg>
