<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bh-bg       { fill: #111215; stroke: #2C303B; stroke-width: 1.5; }
      .plate-tag   { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #E11D48; letter-spacing: 1.5px; }
      .bh-title    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, sans-serif; font-weight: 900; font-size: 52px; letter-spacing: -2px; fill: #FDFBF7; }
      .bh-sub      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 500; font-size: 14.5px; fill: #9496A1; }
      .bh-meta     { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #71737E; }
      .bh-val      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #FDFBF7; }
      .blue-chip   { fill: #2563EB; }
      .red-chip    { fill: #E11D48; }
      .ochre-chip  { fill: #F59E0B; }

      /* Kinetic 3D Wireframe Cube Animation */
      @keyframes spin3D {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.05); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes pulseRing {
        0% { r: 3px; opacity: 1; stroke-width: 1px; }
        100% { r: 10px; opacity: 0; stroke-width: 2px; }
      }
      @keyframes crosshairGlow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .wireframe-spin { transform-origin: 730px 120px; animation: spin3D 14s linear infinite; }
      .status-pulse   { animation: pulseRing 1.8s cubic-bezier(0, 0.2, 0.8, 1) infinite; stroke: #10B981; fill: none; }
      .cross-blink    { animation: crosshairGlow 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Frame -->
  <rect width="850" height="240" rx="4" class="bh-bg"/>

  <!-- Constructivist Corner Marks -->
  <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="14px" fill="#E11D48" class="cross-blink">+</text>
  <text x="824" y="24" font-family="'JetBrains Mono', monospace" font-size="14px" fill="#2563EB" class="cross-blink">+</text>
  <text x="14" y="226" font-family="'JetBrains Mono', monospace" font-size="14px" fill="#F59E0B" class="cross-blink">+</text>
  <text x="824" y="226" font-family="'JetBrains Mono', monospace" font-size="14px" fill="#E11D48" class="cross-blink">+</text>

  <!-- Top Bauhaus Plate Header -->
  <g transform="translate(36, 28)">
    <rect width="18" height="18" fill="#E11D48"/>
    <circle cx="28" cy="9" r="6" fill="#2563EB"/>
    <polygon points="40,18 47,4 54,18" fill="#F59E0B"/>

    <text x="64" y="14" class="plate-tag">PLATE 01 // DEV-FABRIQUE 2026</text>

    <!-- Live Status Badge -->
    <g transform="translate(610, 0)">
      <rect width="168" height="24" rx="2" fill="#181A20" stroke="#2C303B" stroke-width="1"/>
      <circle cx="16" cy="12" r="3.5" class="status-pulse"/>
      <circle cx="16" cy="12" r="3" fill="#10B981"/>
      <text x="28" y="16" font-family="'JetBrains Mono', monospace" font-size="10.5px" font-weight="700" fill="#10B981" letter-spacing="0.8px">STATUS: OPERATIONAL</text>
    </g>
  </g>

  <!-- Main Bauhaus Constructivist Title -->
  <g transform="translate(36, 102)">
    <text x="0" y="0" class="bh-title">YASH RAUT</text>
    <text x="0" y="28" class="bh-sub">Form follows function. Constructing deterministic AI systems &amp; scalable web infrastructure.</text>
  </g>

  <!-- Kinetic 3D Rotating Geometric Polyhedron / Wireframe Object -->
  <g class="wireframe-spin">
    <!-- Outer Octagon / Isometric Cube -->
    <polygon points="730,75 765,95 765,145 730,165 695,145 695,95" fill="none" stroke="#2563EB" stroke-width="1.8"/>
    <!-- Inner Connections -->
    <line x1="730" y1="75" x2="730" y2="165" stroke="#E11D48" stroke-width="1.5"/>
    <line x1="695" y1="95" x2="765" y2="145" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="765" y1="95" x2="695" y2="145" stroke="#2563EB" stroke-width="1.5"/>
    
    <!-- Central Node -->
    <circle cx="730" cy="120" r="4" fill="#FDFBF7"/>
    <!-- Orbit Nodes -->
    <circle cx="730" cy="75" r="3" fill="#E11D48"/>
    <circle cx="765" cy="95" r="3" fill="#2563EB"/>
    <circle cx="765" cy="145" r="3" fill="#F59E0B"/>
    <circle cx="730" cy="165" r="3" fill="#E11D48"/>
    <circle cx="695" cy="145" r="3" fill="#2563EB"/>
    <circle cx="695" cy="95" r="3" fill="#F59E0B"/>
  </g>

  <!-- Bottom Metadata Strip -->
  <line x1="36" y1="172" x2="620" y2="172" stroke="#2C303B" stroke-width="1"/>

  <g transform="translate(36, 202)">
    <text x="0" y="0" class="bh-meta">ORIGIN:</text>
    <text x="56" y="0" class="bh-val">Mumbai, India</text>

    <circle cx="150" cy="-4" r="2" fill="#2563EB"/>

    <text x="165" y="0" class="bh-meta">TIMEZONE:</text>
    <text x="235" y="0" class="bh-val">IST (UTC +5:30)</text>

    <circle cx="340" cy="-4" r="2" fill="#E11D48"/>

    <text x="355" y="0" class="bh-meta">DISCIPLINE:</text>
    <text x="435" y="0" class="bh-val" style="fill:#2563EB;">AI &amp; Full-Stack</text>
  </g>
</svg>
