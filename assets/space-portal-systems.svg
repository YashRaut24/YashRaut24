<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .portal-bg   { fill: #0B0C10; stroke: #1F2430; stroke-width: 1.5; }
      .tag-lbl     { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #00F0FF; letter-spacing: 2px; }
      .sub-lbl     { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; fill: #71737E; letter-spacing: 1.5px; }
      .col-box     { fill: #111216; stroke: #1F2430; stroke-width: 1.2; }
      .col-head    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 800; fill: #FDFBF7; letter-spacing: 1px; }
      .col-role    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #2563EB; letter-spacing: 1.5px; }
      .tech-tag    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #FDFBF7; }
      .tech-desc   { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 8.5px; fill: #71737E; }

      @keyframes beaconBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
      .beacon { animation: beaconBlink 1.2s steps(2, start) infinite; }
    </style>
  </defs>

  <!-- Portal Container Frame -->
  <rect width="850" height="260" rx="6" class="portal-bg"/>

  <!-- Top System Header Bar -->
  <g transform="translate(26, 24)">
    <circle cx="0" cy="5" r="4" fill="#2563EB" class="beacon"/>
    <text x="14" y="9" class="tag-lbl">PORTAL GATEWAY // SECTOR 02: SPACECRAFT AVIONICS &amp; SUBSYSTEMS</text>
    <text x="610" y="9" class="sub-lbl">[3x CORE FLIGHT DECKS OPERATIONAL]</text>
  </g>
  <line x1="0" y1="44" x2="850" y2="44" stroke="#1F2430" stroke-width="1.2"/>

  <!-- 3 Spacecraft Subsystems Flight Matrix -->
  <g transform="translate(26, 62)">
    
    <!-- COLUMN 01: AI & Autonomous Avionics -->
    <g transform="translate(0, 0)">
      <rect width="252" height="174" rx="4" class="col-box"/>
      <rect x="0" y="0" width="252" height="3" fill="#00F0FF"/>
      
      <g transform="translate(14, 20)">
        <text x="0" y="0" class="col-role">AVIONICS BAY 01</text>
        <text x="0" y="16" class="col-head">AI &amp; AUTONOMOUS SYSTEMS</text>
        <line x1="0" y1="26" x2="224" y2="26" stroke="#1F2430" stroke-width="1"/>

        <!-- Capability Items -->
        <g transform="translate(0, 42)">
          <rect x="0" y="-8" width="6" height="6" fill="#00F0FF"/>
          <text x="14" y="-2" class="tech-tag">Agentic AI Workflows</text>
          <text x="14" y="10" class="tech-desc">Multi-agent planners &amp; tools</text>
        </g>
        <g transform="translate(0, 72)">
          <rect x="0" y="-8" width="6" height="6" fill="#00F0FF"/>
          <text x="14" y="-2" class="tech-tag">LLM &amp; Neural Pipelines</text>
          <text x="14" y="10" class="tech-desc">PyTorch, LangChain, RAG</text>
        </g>
        <g transform="translate(0, 102)">
          <rect x="0" y="-8" width="6" height="6" fill="#00F0FF"/>
          <text x="14" y="-2" class="tech-tag">Vector Memory Stores</text>
          <text x="14" y="10" class="tech-desc">Low-latency semantic retrieval</text>
        </g>
      </g>
    </g>

    <!-- COLUMN 02: Core Propulsion & Full-Stack -->
    <g transform="translate(272, 0)">
      <rect width="252" height="174" rx="4" class="col-box"/>
      <rect x="0" y="0" width="252" height="3" fill="#2563EB"/>

      <g transform="translate(14, 20)">
        <text x="0" y="0" class="col-role">PROPULSION BAY 02</text>
        <text x="0" y="16" class="col-head">CORE ENGINES &amp; APIS</text>
        <line x1="0" y1="26" x2="224" y2="26" stroke="#1F2430" stroke-width="1"/>

        <!-- Capability Items -->
        <g transform="translate(0, 42)">
          <rect x="0" y="-8" width="6" height="6" fill="#2563EB"/>
          <text x="14" y="-2" class="tech-tag">Distributed Microservices</text>
          <text x="14" y="10" class="tech-desc">FastAPI, Node.js, Go Services</text>
        </g>
        <g transform="translate(0, 72)">
          <rect x="0" y="-8" width="6" height="6" fill="#2563EB"/>
          <text x="14" y="-2" class="tech-tag">Mission Flight Consoles</text>
          <text x="14" y="10" class="tech-desc">React, Next.js, TypeScript</text>
        </g>
        <g transform="translate(0, 102)">
          <rect x="0" y="-8" width="6" height="6" fill="#2563EB"/>
          <text x="14" y="-2" class="tech-tag">High-Throughput Databases</text>
          <text x="14" y="10" class="tech-desc">PostgreSQL, Redis, MongoDB</text>
        </g>
      </g>
    </g>

    <!-- COLUMN 03: Orbital Infra & DevOps -->
    <g transform="translate(544, 0)">
      <rect width="252" height="174" rx="4" class="col-box"/>
      <rect x="0" y="0" width="252" height="3" fill="#E11D48"/>

      <g transform="translate(14, 20)">
        <text x="0" y="0" class="col-role">INFRASTRUCTURE BAY 03</text>
        <text x="0" y="16" class="col-head">ORBITAL CLOUD &amp; DEVOPS</text>
        <line x1="0" y1="26" x2="224" y2="26" stroke="#1F2430" stroke-width="1"/>

        <!-- Capability Items -->
        <g transform="translate(0, 42)">
          <rect x="0" y="-8" width="6" height="6" fill="#E11D48"/>
          <text x="14" y="-2" class="tech-tag">Container Orchestration</text>
          <text x="14" y="10" class="tech-desc">Docker, Kubernetes clusters</text>
        </g>
        <g transform="translate(0, 72)">
          <rect x="0" y="-8" width="6" height="6" fill="#E11D48"/>
          <text x="14" y="-2" class="tech-tag">Automated Launch Pipelines</text>
          <text x="14" y="10" class="tech-desc">GitHub Actions CI/CD workflows</text>
        </g>
        <g transform="translate(0, 102)">
          <rect x="0" y="-8" width="6" height="6" fill="#E11D48"/>
          <text x="14" y="-2" class="tech-tag">Telemetry &amp; Observability</text>
          <text x="14" y="10" class="tech-desc">Prometheus, Grafana, Tracing</text>
        </g>
      </g>
    </g>

  </g>
</svg>
