<svg width="850" height="270" viewBox="0 0 850 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bh-bg       { fill: #111215; stroke: #2C303B; stroke-width: 1.5; }
      .tile-bg     { fill: #16171C; stroke: #2C303B; stroke-width: 1; }
      .tile-tag    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; }
      .tile-head   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 15px; font-weight: 800; fill: #FDFBF7; }
      .tile-item   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; fill: #E6E4DF; }
      .tile-sub    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 11px; fill: #71737E; }
      
      @keyframes floatDot {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .dot-anim-1 { animation: floatDot 2.2s ease-in-out infinite; }
      .dot-anim-2 { animation: floatDot 2.8s ease-in-out infinite; }
      .dot-anim-3 { animation: floatDot 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="850" height="270" rx="4" class="bh-bg"/>

  <!-- Top Title -->
  <g transform="translate(24, 22)">
    <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="700" fill="#FDFBF7" letter-spacing="1.5px">PLATE 02 // ARCHITECTURAL CAPABILITIES MATRIX</text>
    <text x="560" y="10" font-family="'JetBrains Mono', monospace" font-size="10px" fill="#71737E">[STANDARDS &amp; DISCIPLINES]</text>
  </g>
  <line x1="0" y1="42" x2="850" y2="42" stroke="#2C303B" stroke-width="1"/>

  <!-- 3 Columns: Width 254 each, Gap 14, Total 790 -->
  
  <!-- Col 1: AI & NEURAL -->
  <g transform="translate(24, 56)">
    <rect width="254" height="194" rx="2" class="tile-bg"/>
    <rect x="0" y="0" width="254" height="4" fill="#2563EB"/>
    <text x="18" y="24" class="tile-tag" style="fill:#2563EB;">01 // AI &amp; NEURAL CORE</text>
    <text x="18" y="46" class="tile-head">Agentic AI &amp; RAG</text>

    <g transform="translate(18, 70)">
      <circle cx="4" cy="4" r="3" fill="#2563EB" class="dot-anim-1"/>
      <text x="14" y="8" class="tile-item">LangChain Multi-Agents</text>
      <text x="14" y="22" class="tile-sub">Autonomous tool orchestration</text>

      <circle cx="4" cy="40" r="3" fill="#2563EB" class="dot-anim-2"/>
      <text x="14" y="44" class="tile-item">ChromaDB Vector Store</text>
      <text x="14" y="58" class="tile-sub">Semantic search &amp; embeddings</text>

      <circle cx="4" cy="76" r="3" fill="#2563EB" class="dot-anim-3"/>
      <text x="14" y="80" class="tile-item">Groq &amp; OpenAI API</text>
      <text x="14" y="94" class="tile-sub">Sub-50ms inference workflows</text>
    </g>
  </g>

  <!-- Col 2: DISTRIBUTED FULL-STACK -->
  <g transform="translate(298, 56)">
    <rect width="254" height="194" rx="2" class="tile-bg"/>
    <rect x="0" y="0" width="254" height="4" fill="#E11D48"/>
    <text x="18" y="24" class="tile-tag" style="fill:#E11D48;">02 // WEB &amp; API ENGINES</text>
    <text x="18" y="46" class="tile-head">Full-Stack Architecture</text>

    <g transform="translate(18, 70)">
      <circle cx="4" cy="4" r="3" fill="#E11D48" class="dot-anim-3"/>
      <text x="14" y="8" class="tile-item">React &amp; Next.js</text>
      <text x="14" y="22" class="tile-sub">SSR, App Router &amp; client UI</text>

      <circle cx="4" cy="40" r="3" fill="#E11D48" class="dot-anim-1"/>
      <text x="14" y="44" class="tile-item">FastAPI &amp; Python</text>
      <text x="14" y="58" class="tile-sub">High-throughput async APIs</text>

      <circle cx="4" cy="76" r="3" fill="#E11D48" class="dot-anim-2"/>
      <text x="14" y="80" class="tile-item">Node.js &amp; Express</text>
      <text x="14" y="94" class="tile-sub">RESTful microservices &amp; types</text>
    </g>
  </g>

  <!-- Col 3: DATA & DEVOPS -->
  <g transform="translate(572, 56)">
    <rect width="254" height="194" rx="2" class="tile-bg"/>
    <rect x="0" y="0" width="254" height="4" fill="#F59E0B"/>
    <text x="18" y="24" class="tile-tag" style="fill:#F59E0B;">03 // DATA &amp; DEVOPS</text>
    <text x="18" y="46" class="tile-head">Infrastructure &amp; DB</text>

    <g transform="translate(18, 70)">
      <circle cx="4" cy="4" r="3" fill="#F59E0B" class="dot-anim-2"/>
      <text x="14" y="8" class="tile-item">PostgreSQL &amp; MongoDB</text>
      <text x="14" y="22" class="tile-sub">Relational &amp; document modeling</text>

      <circle cx="4" cy="40" r="3" fill="#F59E0B" class="dot-anim-3"/>
      <text x="14" y="44" class="tile-item">Docker Containers</text>
      <text x="14" y="58" class="tile-sub">Isolated deployment layers</text>

      <circle cx="4" cy="76" r="3" fill="#F59E0B" class="dot-anim-1"/>
      <text x="14" y="80" class="tile-item">Git &amp; Vercel CI/CD</text>
      <text x="14" y="94" class="tile-sub">Automated build pipelines</text>
    </g>
  </g>
</svg>
