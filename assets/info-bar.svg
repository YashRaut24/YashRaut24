<svg width="900" height="110" viewBox="0 0 900 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-bg   { fill: #121316; }
      .border    { stroke: #2A2C33; stroke-width: 1.5; }
      .tag       { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; fill: #E06C43; }
      .val       { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 15px; font-weight: 800; fill: #FBFBFC; }
      .sub       { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500; fill: #71717A; }
      .idx       { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #52525B; }
      .dot       { fill: #E06C43; }
    </style>
  </defs>

  <!-- 4 Cards Layout: Width 216 each, Gap 12 -->
  <!-- Card 1: ORIGIN -->
  <g transform="translate(0, 0)">
    <rect width="216" height="110" rx="6" class="card-bg"/>
    <rect width="216" height="110" rx="6" class="border" fill="none"/>
    <text x="180" y="26" class="idx">§ 01</text>
    <text x="20" y="26" class="tag">ORIGIN</text>
    <text x="20" y="58" class="val">Mumbai, India</text>
    <text x="20" y="84" class="sub">MAHARASHTRA, IN</text>
  </g>

  <!-- Card 2: CHRONO -->
  <g transform="translate(228, 0)">
    <rect width="216" height="110" rx="6" class="card-bg"/>
    <rect width="216" height="110" rx="6" class="border" fill="none"/>
    <text x="180" y="26" class="idx">§ 02</text>
    <text x="20" y="26" class="tag">CHRONO</text>
    <text x="20" y="58" class="val">Asia / Kolkata</text>
    <text x="20" y="84" class="sub">IST (UTC +05:30)</text>
  </g>

  <!-- Card 3: DOMAIN -->
  <g transform="translate(456, 0)">
    <rect width="216" height="110" rx="6" class="card-bg"/>
    <rect width="216" height="110" rx="6" class="border" fill="none"/>
    <text x="180" y="26" class="idx">§ 03</text>
    <text x="20" y="26" class="tag" style="fill:#F59E0B;">DOMAIN</text>
    <text x="20" y="58" class="val">AI Engineering</text>
    <text x="20" y="84" class="sub">LLMs &amp; DISTRIBUTED</text>
  </g>

  <!-- Card 4: DISPATCH -->
  <g transform="translate(684, 0)">
    <rect width="216" height="110" rx="6" class="card-bg"/>
    <rect width="216" height="110" rx="6" class="border" fill="none"/>
    <circle cx="160" cy="22" r="3" class="dot"/>
    <text x="180" y="26" class="idx">§ 04</text>
    <text x="20" y="26" class="tag" style="fill:#D4D4D8;">DISPATCH</text>
    <text x="20" y="58" class="val">Active for Build</text>
    <text x="20" y="84" class="sub">OPEN TO ENGAGE</text>
  </g>
</svg>
