<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .term-bg      { fill: #0D1117; stroke: #21262D; stroke-width: 1.5; }
      .term-bar     { fill: #161B22; }
      .term-title   { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #8B949E; }
      .ascii-art    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #38BDF8; line-height: 14px; white-space: pre; }
      .term-text    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; fill: #C9D1D9; }
      .term-prompt  { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #38BDF8; }
      .term-cmd     { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #F0F6FC; }
      .term-acc     { fill: #10B981; font-weight: 600; }
      .term-dim     { fill: #8B949E; }
      .term-tag     { fill: #F59E0B; }
      .cursor       { fill: #38BDF8; }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor-blink { animation: blink 1s infinite; }

      @keyframes typeLine1 { 0%, 10% { opacity: 0; } 15%, 100% { opacity: 1; } }
      @keyframes typeLine2 { 0%, 25% { opacity: 0; } 30%, 100% { opacity: 1; } }
      @keyframes typeLine3 { 0%, 45% { opacity: 0; } 50%, 100% { opacity: 1; } }
      @keyframes typeLine4 { 0%, 65% { opacity: 0; } 70%, 100% { opacity: 1; } }
      @keyframes typeLine5 { 0%, 85% { opacity: 0; } 90%, 100% { opacity: 1; } }

      .anim-l1 { animation: typeLine1 6s infinite; }
      .anim-l2 { animation: typeLine2 6s infinite; }
      .anim-l3 { animation: typeLine3 6s infinite; }
      .anim-l4 { animation: typeLine4 6s infinite; }
      .anim-l5 { animation: typeLine5 6s infinite; }
    </style>
  </defs>

  <!-- Terminal Window Container -->
  <rect width="900" height="320" rx="8" class="term-bg"/>

  <!-- Title Bar -->
  <path d="M0 8C0 3.58172 3.58172 0 8 0H892C896.418 0 900 3.58172 900 8V34H0V8Z" class="term-bar"/>
  <line x1="0" y1="34" x2="900" y2="34" stroke="#21262D" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="20" cy="17" r="4.5" fill="#EF4444"/>
  <circle cx="36" cy="17" r="4.5" fill="#F59E0B"/>
  <circle cx="52" cy="17" r="4.5" fill="#10B981"/>

  <!-- Window Title -->
  <text x="450" y="22" text-anchor="middle" class="term-title">yr@cyber-lab: ~ (zsh)</text>

  <!-- ASCII Art Identity -->
  <g transform="translate(30, 60)">
    <text x="0" y="0" class="ascii-art">
██╗   ██╗ █████╗ ███████╗██╗  ██╗    ██████╗  █████╗ ██╗   ██╗████████╗
╚██╗ ██╔╝██╔══██╗██╔════╝██║  ██║    ██╔══██╗██╔══██╗██║   ██║╚══██╔══╝
 ╚████╔╝ ███████║███████╗███████║    ██████╔╝███████║██║   ██║   ██║   
  ╚██╔╝  ██╔══██║╚════██║██╔══██║    ██╔══██╗██╔══██║██║   ██║   ██║   
   ██║   ██║  ██║███████║██║  ██║    ██║  ██║██║  ██║╚██████╔╝   ██║   
   ╚═╝   ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝    ╚═╝  ╚═╝╚═╝  ╚═╝ ╚═════╝    ╚═╝   </text>
  </g>

  <!-- Interactive Boot Commands & Output -->
  <g transform="translate(30, 165)">
    <!-- Command Prompt 1 -->
    <g class="anim-l1">
      <text x="0" y="0" class="term-prompt">➜ </text>
      <text x="20" y="0" class="term-cmd">yr --boot --verbose</text>
    </g>

    <!-- Line 2: Role -->
    <g transform="translate(0, 24)" class="anim-l2">
      <text x="0" y="0" class="term-dim">[01/04]</text>
      <text x="70" y="0" class="term-text">ROLE: <tspan class="term-acc">AI Engineer &amp; Full-Stack Architect</tspan></text>
    </g>

    <!-- Line 3: Focus -->
    <g transform="translate(0, 48)" class="anim-l3">
      <text x="0" y="0" class="term-dim">[02/04]</text>
      <text x="70" y="0" class="term-text">FOCUS: <tspan style="fill:#F0F6FC;">LLM Multi-Agent Systems, RAG Pipelines &amp; High-Throughput APIs</tspan></text>
    </g>

    <!-- Line 4: Stack -->
    <g transform="translate(0, 72)" class="anim-l4">
      <text x="0" y="0" class="term-dim">[03/04]</text>
      <text x="70" y="0" class="term-text">STACK: <tspan class="term-tag">TypeScript • Python • FastAPI • React • LangChain • ChromaDB • Docker</tspan></text>
    </g>

    <!-- Line 5: Active Prompt & Status -->
    <g transform="translate(0, 102)" class="anim-l5">
      <text x="0" y="0" class="term-prompt">➜ </text>
      <text x="20" y="0" class="term-cmd">status --all</text>
      <text x="140" y="0" class="term-acc">● ONLINE [Ready to Architect &amp; Build]</text>
      <rect x="470" y="-12" width="8" height="15" class="cursor cursor-blink"/>
    </g>
  </g>
</svg>
