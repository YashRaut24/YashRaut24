<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-bg     { fill: #121316; }
      .border      { stroke: #2A2C33; stroke-width: 1.5; }
      .dir-header  { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #E06C43; letter-spacing: 1.5px; }
      .dir-title   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 14px; font-weight: 800; fill: #FBFBFC; letter-spacing: 0.5px; }
      .tech-name   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; fill: #D4D4D8; }
      .tech-desc   { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #71717A; }
      .col-frame   { fill: #191B1F; stroke: #2A2C33; stroke-width: 1; }
    </style>
  </defs>

  <rect width="900" height="260" rx="6" class="card-bg"/>
  <rect width="900" height="260" rx="6" class="border" fill="none"/>

  <!-- Top Title -->
  <g transform="translate(24, 20)">
    <text x="0" y="14" class="dir-title">TECHNICAL CAPABILITIES DIRECTORY</text>
    <text x="320" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5px" fill="#71717A">// CURATED STACK &amp; TOOLING</text>
  </g>
  <line x1="0" y1="46" x2="900" y2="46" stroke="#2A2C33" stroke-width="1"/>

  <!-- 4 Columns: Width 206 each, Gap 10 -->
  
  <!-- Col 1: RUNTIMES -->
  <g transform="translate(24, 58)">
    <rect width="204" height="182" rx="4" class="col-frame"/>
    <text x="16" y="24" class="dir-header">01. LANGUAGES</text>
    <line x1="16" y1="34" x2="188" y2="34" stroke="#2A2C33" stroke-width="1"/>

    <g transform="translate(16, 52)">
      <circle cx="3" cy="3" r="2" fill="#E06C43"/>
      <text x="12" y="7" class="tech-name">TypeScript / JS</text>
      <text x="12" y="20" class="tech-desc">ESNext, Strict Typing</text>

      <circle cx="3" cy="36" r="2" fill="#E06C43"/>
      <text x="12" y="40" class="tech-name">Python</text>
      <text x="12" y="53" class="tech-desc">AI &amp; Asynchronous IO</text>

      <circle cx="3" cy="69" r="2" fill="#E06C43"/>
      <text x="12" y="73" class="tech-name">C++ &amp; Java</text>
      <text x="12" y="86" class="tech-desc">Algorithms, OOP Core</text>
    </g>
  </g>

  <!-- Col 2: AI & NEURAL -->
  <g transform="translate(238, 58)">
    <rect width="204" height="182" rx="4" class="col-frame"/>
    <text x="16" y="24" class="dir-header" style="fill:#F59E0B;">02. AI &amp; AGENTS</text>
    <line x1="16" y1="34" x2="188" y2="34" stroke="#2A2C33" stroke-width="1"/>

    <g transform="translate(16, 52)">
      <circle cx="3" cy="3" r="2" fill="#F59E0B"/>
      <text x="12" y="7" class="tech-name">LangChain</text>
      <text x="12" y="20" class="tech-desc">Multi-Agent Systems</text>

      <circle cx="3" cy="36" r="2" fill="#F59E0B"/>
      <text x="12" y="40" class="tech-name">ChromaDB</text>
      <text x="12" y="53" class="tech-desc">Vector Embeddings RAG</text>

      <circle cx="3" cy="69" r="2" fill="#F59E0B"/>
      <text x="12" y="73" class="tech-name">Groq &amp; OpenAI</text>
      <text x="12" y="86" class="tech-desc">Low Latency LLMs</text>
    </g>
  </g>

  <!-- Col 3: APPLICATION -->
  <g transform="translate(452, 58)">
    <rect width="204" height="182" rx="4" class="col-frame"/>
    <text x="16" y="24" class="dir-header" style="fill:#D4D4D8;">03. WEB &amp; APIS</text>
    <line x1="16" y1="34" x2="188" y2="34" stroke="#2A2C33" stroke-width="1"/>

    <g transform="translate(16, 52)">
      <circle cx="3" cy="3" r="2" fill="#D4D4D8"/>
      <text x="12" y="7" class="tech-name">React &amp; Next.js</text>
      <text x="12" y="20" class="tech-desc">Modern Client &amp; SSR</text>

      <circle cx="3" cy="36" r="2" fill="#D4D4D8"/>
      <text x="12" y="40" class="tech-name">Node.js &amp; Express</text>
      <text x="12" y="53" class="tech-desc">High-Throughput APIs</text>

      <circle cx="3" cy="69" r="2" fill="#D4D4D8"/>
      <text x="12" y="73" class="tech-name">FastAPI</text>
      <text x="12" y="86" class="tech-desc">Python Web Engines</text>
    </g>
  </g>

  <!-- Col 4: INFRASTRUCTURE -->
  <g transform="translate(666, 58)">
    <rect width="208" height="182" rx="4" class="col-frame"/>
    <text x="16" y="24" class="dir-header" style="fill:#A1A1AA;">04. INFRA &amp; DATA</text>
    <line x1="16" y1="34" x2="192" y2="34" stroke="#2A2C33" stroke-width="1"/>

    <g transform="translate(16, 52)">
      <circle cx="3" cy="3" r="2" fill="#A1A1AA"/>
      <text x="12" y="7" class="tech-name">MongoDB &amp; Postgres</text>
      <text x="12" y="20" class="tech-desc">Document &amp; Relational</text>

      <circle cx="3" cy="36" r="2" fill="#A1A1AA"/>
      <text x="12" y="40" class="tech-name">Docker</text>
      <text x="12" y="53" class="tech-desc">Container Pipelines</text>

      <circle cx="3" cy="69" r="2" fill="#A1A1AA"/>
      <text x="12" y="73" class="tech-name">Git &amp; GitHub</text>
      <text x="12" y="86" class="tech-desc">CI/CD Deployments</text>
    </g>
  </g>
</svg>
