<svg width="900" height="250" viewBox="0 0 900 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .masthead-top  { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; fill: #71717A; letter-spacing: 1.5px; }
      .masthead-acc  { fill: #E06C43; font-weight: 700; }
      .main-title    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; font-weight: 900; font-size: 64px; letter-spacing: -2.5px; fill: #FBFBFC; }
      .role-tag      { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #E06C43; letter-spacing: 2px; }
      .lead-p        { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 400; font-size: 14.5px; fill: #A1A1AA; letter-spacing: 0.2px; }
      .index-strip   { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500; fill: #71717A; letter-spacing: 1px; }
      .status-dot    { fill: #E06C43; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="900" height="250" rx="6" fill="#121316" stroke="#2A2C33" stroke-width="1.5"/>

  <!-- Top Publication Header Bar -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="masthead-top">
      DOSSIER <tspan class="masthead-acc">NO. 24</tspan> // VOL. 2026
    </text>
    <text x="430" y="0" text-anchor="middle" class="masthead-top">
      MUMBAI, IN [19.0760° N, 72.8777° E]
    </text>
    <circle cx="814" cy="-3" r="3.5" class="status-dot"/>
    <text x="836" y="0" text-anchor="end" class="masthead-top" style="fill:#FBFBFC;">
      ACTIVE FOR ROLES
    </text>
  </g>

  <!-- Header Rule Line -->
  <line x1="32" y1="42" x2="868" y2="42" stroke="#2A2C33" stroke-width="1"/>

  <!-- Main Editorial Title -->
  <text x="32" y="112" class="main-title">YASH RAUT</text>
  <text x="32" y="140" class="role-tag">SOFTWARE ENGINEER &amp; AI ARCHITECT</text>

  <!-- Lead Abstract Paragraph -->
  <text x="32" y="174" class="lead-p">
    Designing deterministic AI workflows, autonomous agent networks, and high-performance full-stack web infrastructure.
  </text>

  <!-- Bottom Divider Line -->
  <line x1="32" y1="202" x2="868" y2="202" stroke="#2A2C33" stroke-width="1"/>

  <!-- Index Strip -->
  <g transform="translate(32, 226)">
    <text x="0" y="0" class="index-strip">DISCIPLINES:</text>
    <text x="96" y="0" class="index-strip" style="fill:#D4D4D8;">[01] LLM ORCHESTRATION</text>
    <circle cx="280" cy="-3" r="2" fill="#E06C43"/>
    <text x="296" y="0" class="index-strip" style="fill:#D4D4D8;">[02] RAG ARCHITECTURE</text>
    <circle cx="475" cy="-3" r="2" fill="#E06C43"/>
    <text x="490" y="0" class="index-strip" style="fill:#D4D4D8;">[03] DISTRIBUTED SYSTEMS</text>
    <circle cx="685" cy="-3" r="2" fill="#E06C43"/>
    <text x="700" y="0" class="index-strip" style="fill:#D4D4D8;">[04] FULL-STACK MERN</text>
  </g>
</svg>
