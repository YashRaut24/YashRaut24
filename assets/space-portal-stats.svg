<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .portal-bg       { fill: #0B0C10; stroke: #1F2430; stroke-width: 1.5; }
      .tag-lbl         { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #00F0FF; letter-spacing: 2px; }
      .sub-lbl         { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; fill: #71737E; letter-spacing: 1.5px; }
      .callout-txt     { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #FDFBF7; }
      .num-val         { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 38px; font-weight: 900; fill: #00F0FF; letter-spacing: -0.5px; }
      .num-sub         { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 38px; font-weight: 900; fill: #2563EB; letter-spacing: -0.5px; }
      .lbl-main        { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #2563EB; letter-spacing: 1px; }
      .lbl-center      { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12.5px; font-weight: 800; fill: #00F0FF; letter-spacing: 1px; }
      .date-txt        { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; fill: #71737E; letter-spacing: 0.5px; }

      @keyframes ringPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50%      { transform: scale(1.06); opacity: 0.5; }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.2; }
      }

      .pulse-ring { animation: ringPulse 3s ease-in-out infinite; transform-origin: 425px 122px; }
      .beacon     { animation: beaconBlink 1.2s steps(2, start) infinite; }
    </style>
  </defs>

  <!-- Container Box Frame -->
  <rect width="850" height="210" rx="6" class="portal-bg"/>

  <!-- Top System Header Bar -->
  <g transform="translate(26, 24)">
    <circle cx="0" cy="5" r="4" fill="#39D353" class="beacon"/>
    <text x="14" y="9" class="tag-lbl">PORTAL GATEWAY // SECTOR 04: FLIGHT STREAKS &amp; CONTRIBUTION CADENCE</text>
    <text x="590" y="9" class="sub-lbl">[LIVE TELEMETRY STREAM CONNECTED]</text>
  </g>
  <line x1="0" y1="44" x2="850" y2="44" stroke="#1F2430" stroke-width="1.2"/>

  <!-- Sub-Quote Pill -->
  <g transform="translate(26, 56)">
    <rect width="270" height="24" rx="12" fill="#111216" stroke="#1F2430" stroke-width="1"/>
    <text x="12" y="16" class="callout-txt">🚀 Side projects are where most new ideas begin.</text>
  </g>

  <!-- 3-Column Streak & Contribution Deck -->
  <g transform="translate(0, 75)">
    
    <!-- COLUMN 1: Total Contributions -->
    <g transform="translate(140, 48)">
      <text x="0" y="0" text-anchor="middle" class="num-val">1,511</text>
      <text x="0" y="24" text-anchor="middle" class="lbl-main">Total Contributions</text>
      <text x="0" y="44" text-anchor="middle" class="date-txt">Aug 9, 2024 – Present</text>
    </g>

    <!-- Divider Line 1 -->
    <line x1="285" y1="18" x2="285" y2="108" stroke="#1F2430" stroke-width="1.2"/>

    <!-- COLUMN 2: Current Streak (Highlighted Center Ring with Flame) -->
    <g transform="translate(425, 48)">
      <!-- Animated Center Ring -->
      <circle cx="0" cy="-1" r="38" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="8 4" class="pulse-ring"/>
      <circle cx="0" cy="-1" r="44" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3"/>
      
      <!-- Flame Icon -->
      <g transform="translate(-8, -50)">
        <path d="M8,0 C4,4 0,9 0,14 C0,19 4,22 8,22 C12,22 16,19 16,14 C16,9 12,4 8,0 Z M8,18 C6,18 4,16 4,14 C4,12 6,10 8,8 C10,10 12,12 12,14 C12,16 10,18 8,18 Z" fill="#00F0FF"/>
      </g>
      
      <!-- Center Streak Number -->
      <text x="0" y="12" text-anchor="middle" class="num-val" style="fill:#FDFBF7;">77</text>
      
      <!-- Label & Date Range -->
      <text x="0" y="58" text-anchor="middle" class="lbl-center">Current Streak</text>
      <text x="0" y="76" text-anchor="middle" class="date-txt">Jun 11 – Aug 26</text>
    </g>

    <!-- Divider Line 2 -->
    <line x1="565" y1="18" x2="565" y2="108" stroke="#1F2430" stroke-width="1.2"/>

    <!-- COLUMN 3: Longest Streak -->
    <g transform="translate(710, 48)">
      <text x="0" y="0" text-anchor="middle" class="num-sub" style="fill:#2563EB;">77</text>
      <text x="0" y="24" text-anchor="middle" class="lbl-main">Longest Streak</text>
      <text x="0" y="44" text-anchor="middle" class="date-txt">Jun 11 – Aug 26</text>
    </g>

  </g>
</svg>
