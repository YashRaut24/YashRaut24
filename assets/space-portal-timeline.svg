<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .portal-bg       { fill: #0B0C10; stroke: #1F2430; stroke-width: 1.5; }
      .tag-lbl         { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #00F0FF; letter-spacing: 2px; }
      .sub-lbl         { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; fill: #71737E; letter-spacing: 1.5px; }
      .card-box        { fill: #111216; stroke: #1F2430; stroke-width: 1.2; }
      .role-tag        { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #00F0FF; letter-spacing: 1px; }
      .company-txt     { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; fill: #FDFBF7; }
      .date-txt        { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; fill: #71737E; letter-spacing: 0.5px; }
      .desc-txt        { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; fill: #A0A5B5; line-height: 14px; }

      @keyframes beaconBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.2; }
      }
      @keyframes pulseWaypoint {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50%      { transform: scale(1.3); opacity: 0.4; }
      }

      .beacon   { animation: beaconBlink 1.2s steps(2, start) infinite; }
      .pulse-w1 { animation: pulseWaypoint 2.5s ease-in-out infinite; transform-origin: 40px 145px; }
      .pulse-w2 { animation: pulseWaypoint 2.5s ease-in-out 0.8s infinite; transform-origin: 310px 145px; }
      .pulse-w3 { animation: pulseWaypoint 2.5s ease-in-out 1.6s infinite; transform-origin: 580px 145px; }
    </style>
  </defs>

  <!-- Container Box Frame -->
  <rect width="850" height="240" rx="6" class="portal-bg"/>

  <!-- Top System Header Bar -->
  <g transform="translate(26, 24)">
    <circle cx="0" cy="5" r="4" fill="#00F0FF" class="beacon"/>
    <text x="14" y="9" class="tag-lbl">PORTAL GATEWAY // SECTOR 05: MISSION FLIGHT LOGS &amp; INDUSTRY EXPERIENCE</text>
    <text x="610" y="9" class="sub-lbl">[EXPERIENCE TRAJECTORY VERIFIED]</text>
  </g>
  <line x1="0" y1="44" x2="850" y2="44" stroke="#1F2430" stroke-width="1.2"/>

  <!-- Experience 3-Stage Mission Logs -->
  <g transform="translate(26, 62)">
    
    <!-- MISSION 01: Sapphire Infocom -->
    <g transform="translate(0, 0)">
      <rect width="252" height="154" rx="4" class="card-box"/>
      <rect x="0" y="0" width="252" height="3" fill="#00F0FF"/>
      
      <g transform="translate(14, 16)">
        <text x="0" y="0" class="role-tag">MISSION LOG 01 // INTERNSHIP</text>
        <text x="0" y="16" class="company-txt">Sapphire Infocom Pvt. Ltd.</text>
        <text x="0" y="30" class="date-txt">Aug 2025 – Nov 2025 · MERN Stack</text>
        <line x1="0" y1="38" x2="224" y2="38" stroke="#1F2430" stroke-width="1"/>

        <g transform="translate(0, 52)">
          <text x="0" y="0" class="desc-txt">• Engineered "Swish" platform with</text>
          <text x="0" y="14" class="desc-txt">  JWT &amp; RBAC for 1,000+ users.</text>
          <text x="0" y="32" class="desc-txt">• Built React frontend with 20+</text>
          <text x="0" y="46" class="desc-txt">  REST APIs &amp; Cloudinary media.</text>
          <text x="0" y="64" class="desc-txt">• Sub-2s image load optimization.</text>
        </g>
      </g>
    </g>

    <!-- MISSION 02: H.K. Gidwani School -->
    <g transform="translate(272, 0)">
      <rect width="252" height="154" rx="4" class="card-box"/>
      <rect x="0" y="0" width="252" height="3" fill="#2563EB"/>

      <g transform="translate(14, 16)">
        <text x="0" y="0" class="role-tag" style="fill:#2563EB;">MISSION LOG 02 // FREELANCE</text>
        <text x="0" y="16" class="company-txt">H.K. Gidwani School</text>
        <text x="0" y="30" class="date-txt">Apr 2026 – May 2026 · Full Stack</text>
        <line x1="0" y1="38" x2="224" y2="38" stroke="#1F2430" stroke-width="1"/>

        <g transform="translate(0, 52)">
          <text x="0" y="0" class="desc-txt">• Built fully functional school portal</text>
          <text x="0" y="14" class="desc-txt">  end-to-end using MERN stack.</text>
          <text x="0" y="32" class="desc-txt">• Developed responsive UI for staff</text>
          <text x="0" y="46" class="desc-txt">  and visitors with fast load speeds.</text>
          <text x="0" y="64" class="desc-txt">• DB connectivity &amp; asset storage.</text>
        </g>
      </g>
    </g>

    <!-- MISSION 03: Community & Tech Leadership -->
    <g transform="translate(544, 0)">
      <rect width="252" height="154" rx="4" class="card-box"/>
      <rect x="0" y="0" width="252" height="3" fill="#39D353"/>

      <g transform="translate(14, 16)">
        <text x="0" y="0" class="role-tag" style="fill:#39D353;">MISSION LOG 03 // LEADERSHIP</text>
        <text x="0" y="16" class="company-txt">Xzibit &amp; E-Cell Community</text>
        <text x="0" y="30" class="date-txt">2026 · Technical Exhibition Lead</text>
        <line x1="0" y1="38" x2="224" y2="38" stroke="#1F2430" stroke-width="1"/>

        <g transform="translate(0, 52)">
          <text x="0" y="0" class="desc-txt">• Coordinated technical project</text>
          <text x="0" y="14" class="desc-txt">  booths for inter-college expo.</text>
          <text x="0" y="32" class="desc-txt">• 2nd Prize in Elevator 300</text>
          <text x="0" y="46" class="desc-txt">  Business Pitch Competition.</text>
          <text x="0" y="64" class="desc-txt">• Active member of E-Cell network.</text>
        </g>
      </g>
    </g>

  </g>
</svg>
