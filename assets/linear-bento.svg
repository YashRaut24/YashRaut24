<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bento-card  { fill: #08090A; stroke: #1F242C; stroke-width: 1; }
      .tile-bg     { fill: #0F1115; stroke: #1F242C; stroke-width: 1; }
      .tile-num    { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #5E6AD2; letter-spacing: 1.2px; }
      .tile-title  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 15px; font-weight: 700; fill: #F7F8F8; }
      .tile-item   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 12.5px; font-weight: 500; fill: #D0D6E0; }
      .tile-sub    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 11px; fill: #62666D; }
      .chip        { fill: #151820; stroke: #262C38; stroke-width: 1; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="850" height="240" rx="10" class="bento-card"/>

  <!-- 3 Tiles: Width 254 each, Gap 12, Total ~786 -->
  
  <!-- Tile 1: AI & AGENTS -->
  <g transform="translate(24, 24)">
    <rect width="254" height="192" rx="8" class="tile-bg"/>
    <text x="18" y="24" class="tile-num">01 / AI &amp; AGENTS</text>
    <text x="18" y="48" class="tile-title">Neural &amp; RAG Systems</text>

    <g transform="translate(18, 72)">
      <circle cx="4" cy="4" r="2" fill="#5E6AD2"/>
      <text x="14" y="8" class="tile-item">LangChain &amp; Agents</text>
      <text x="14" y="22" class="tile-sub">Autonomous tool orchestration</text>

      <circle cx="4" cy="40" r="2" fill="#5E6AD2"/>
      <text x="14" y="44" class="tile-item">ChromaDB Vector Store</text>
      <text x="14" y="58" class="tile-sub">Semantic embeddings &amp; RAG</text>

      <circle cx="4" cy="76" r="2" fill="#5E6AD2"/>
      <text x="14" y="80" class="tile-item">Groq &amp; OpenAI API</text>
      <text x="14" y="94" class="tile-sub">Ultra low-latency inference</text>
    </g>
  </g>

  <!-- Tile 2: FULL-STACK CORE -->
  <g transform="translate(298, 24)">
    <rect width="254" height="192" rx="8" class="tile-bg"/>
    <text x="18" y="24" class="tile-num" style="fill:#38BDF8;">02 / APPLICATION</text>
    <text x="18" y="48" class="tile-title">Full-Stack Architecture</text>

    <g transform="translate(18, 72)">
      <circle cx="4" cy="4" r="2" fill="#38BDF8"/>
      <text x="14" y="8" class="tile-item">React &amp; Next.js</text>
      <text x="14" y="22" class="tile-sub">SSR, App Router &amp; UI state</text>

      <circle cx="4" cy="40" r="2" fill="#38BDF8"/>
      <text x="14" y="44" class="tile-item">FastAPI &amp; Python</text>
      <text x="14" y="58" class="tile-sub">High-throughput async APIs</text>

      <circle cx="4" cy="76" r="2" fill="#38BDF8"/>
      <text x="14" y="80" class="tile-item">Node.js &amp; Express</text>
      <text x="14" y="94" class="tile-sub">RESTful services &amp; middleware</text>
    </g>
  </g>

  <!-- Tile 3: DATA & INFRA -->
  <g transform="translate(572, 24)">
    <rect width="254" height="192" rx="8" class="tile-bg"/>
    <text x="18" y="24" class="tile-num" style="fill:#10B981;">03 / DATA &amp; INFRA</text>
    <text x="18" y="48" class="tile-title">Reliable Foundations</text>

    <g transform="translate(18, 72)">
      <circle cx="4" cy="4" r="2" fill="#10B981"/>
      <text x="14" y="8" class="tile-item">PostgreSQL &amp; MongoDB</text>
      <text x="14" y="22" class="tile-sub">Relational &amp; document stores</text>

      <circle cx="4" cy="40" r="2" fill="#10B981"/>
      <text x="14" y="44" class="tile-item">Docker Containers</text>
      <text x="14" y="58" class="tile-sub">Isolated deployment environments</text>

      <circle cx="4" cy="76" r="2" fill="#10B981"/>
      <text x="14" y="80" class="tile-item">Git, GitHub &amp; Vercel</text>
      <text x="14" y="94" class="tile-sub">Automated CI/CD pipelines</text>
    </g>
  </g>
</svg>
