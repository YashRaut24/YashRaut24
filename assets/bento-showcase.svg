<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-bg    { fill: #0B0F17; stroke: #232D3F; stroke-width: 1.5; }
      .bento-box  { fill: #111726; stroke: #1E293B; stroke-width: 1; }
      .panel-tag  { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #38BDF8; letter-spacing: 1px; }
      .panel-head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 17px; font-weight: 800; fill: #F8FAFC; }
      .panel-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 12.5px; fill: #94A3B8; }
      .code-node  { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #E2E8F0; font-weight: 500; }
      .node-box   { fill: #172136; stroke: #2A3B59; stroke-width: 1; }
      .node-arrow { stroke: #38BDF8; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .metric-num { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 800; fill: #38BDF8; }
      .metric-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; fill: #64748B; font-weight: 500; }
    </style>
  </defs>

  <!-- Left Main Bento Card: AI & RAG Pipeline (Width 548, Height 320) -->
  <g transform="translate(0, 0)">
    <rect width="548" height="320" rx="12" class="card-bg"/>
    <rect width="548" height="320" rx="12" fill="none" stroke="#232D3F" stroke-width="1.5"/>

    <!-- Header Section -->
    <rect x="24" y="24" width="130" height="22" rx="4" fill="#111C2E" stroke="#1E3A5F" stroke-width="1"/>
    <text x="34" y="39" class="panel-tag">01 // AI PIPELINE</text>
    <text x="24" y="78" class="panel-head">Autonomous Agents &amp; RAG Architecture</text>
    <text x="24" y="100" class="panel-desc">Engineering deterministic retrieval systems with structured tool calling.</text>

    <!-- Visual Architecture Flowchart inside the card -->
    <!-- Step 1: Input -->
    <rect x="24" y="132" width="144" height="42" rx="6" class="node-box"/>
    <text x="36" y="152" class="code-node" style="fill:#38BDF8;">01. USER INTENT</text>
    <text x="36" y="166" class="code-node" style="font-size:10px; fill:#94A3B8;">Structured Prompts</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M176 153H196M192 149L196 153L192 157" class="node-arrow"/>

    <!-- Step 2: Vector Search / ChromaDB -->
    <rect x="204" y="132" width="154" height="42" rx="6" class="node-box"/>
    <text x="216" y="152" class="code-node" style="fill:#818CF8;">02. CHROMADB RAG</text>
    <text x="216" y="166" class="code-node" style="font-size:10px; fill:#94A3B8;">Semantic Embeddings</text>

    <!-- Arrow 2 -> 3 -->
    <path d="M366 153H386M382 149L386 153L382 157" class="node-arrow"/>

    <!-- Step 3: LLM Inference -->
    <rect x="394" y="132" width="130" height="42" rx="6" class="node-box"/>
    <text x="406" y="152" class="code-node" style="fill:#34D399;">03. GROQ / LLM</text>
    <text x="406" y="166" class="code-node" style="font-size:10px; fill:#94A3B8;">Low-Latency Exec</text>

    <!-- Bottom Highlights -->
    <rect x="24" y="196" width="500" height="96" rx="8" class="bento-box"/>
    
    <g transform="translate(44, 218)">
      <circle cx="6" cy="6" r="3" fill="#38BDF8"/>
      <text x="18" y="10" class="code-node">Agentic Tool Use</text>
      <text x="18" y="26" class="panel-desc" style="font-size:11px;">LangChain orchestration with custom schemas</text>

      <circle cx="260" cy="6" r="3" fill="#10B981"/>
      <text x="272" y="10" class="code-node">High Accuracy Retrieval</text>
      <text x="272" y="26" class="panel-desc" style="font-size:11px;">Hybrid search &amp; vector context re-ranking</text>
    </g>
  </g>

  <!-- Top-Right Bento Card: Full-Stack Reliability (Width 336, Height 152) -->
  <g transform="translate(564, 0)">
    <rect width="336" height="152" rx="12" class="card-bg"/>
    <rect width="336" height="152" rx="12" fill="none" stroke="#232D3F" stroke-width="1.5"/>

    <rect x="20" y="20" width="126" height="22" rx="4" fill="#111C2E" stroke="#1E3A5F" stroke-width="1"/>
    <text x="30" y="35" class="panel-tag">02 // FULL-STACK</text>

    <text x="20" y="68" class="panel-head">Engineered for Scale</text>
    <text x="20" y="90" class="panel-desc">Node.js, Express &amp; FastAPI backend pipelines</text>
    <text x="20" y="108" class="panel-desc">integrated with responsive React/Next.js interfaces.</text>

    <!-- Mini Pills -->
    <g transform="translate(20, 122)">
      <rect x="0" y="0" width="60" height="18" rx="3" fill="#172136"/>
      <text x="30" y="13" text-anchor="middle" class="code-node" style="font-size:10px; fill:#38BDF8;">MERN</text>

      <rect x="68" y="0" width="70" height="18" rx="3" fill="#172136"/>
      <text x="103" y="13" text-anchor="middle" class="code-node" style="font-size:10px; fill:#818CF8;">FASTAPI</text>

      <rect x="146" y="0" width="68" height="18" rx="3" fill="#172136"/>
      <text x="180" y="13" text-anchor="middle" class="code-node" style="font-size:10px; fill:#34D399;">DOCKER</text>
    </g>
  </g>

  <!-- Bottom-Right Bento Card: System Telemetry (Width 336, Height 152) -->
  <g transform="translate(564, 168)">
    <rect width="336" height="152" rx="12" class="card-bg"/>
    <rect width="336" height="152" rx="12" fill="none" stroke="#232D3F" stroke-width="1.5"/>

    <rect x="20" y="18" width="134" height="22" rx="4" fill="#111C2E" stroke="#1E3A5F" stroke-width="1"/>
    <text x="30" y="33" class="panel-tag">03 // TELEMETRY</text>

    <g transform="translate(20, 62)">
      <!-- Metric 1 -->
      <text x="0" y="20" class="metric-num">100%</text>
      <text x="0" y="38" class="metric-lbl">CODE RIGOR</text>

      <!-- Metric 2 -->
      <text x="110" y="20" class="metric-num">&lt;50ms</text>
      <text x="110" y="38" class="metric-lbl">API LATENCY</text>

      <!-- Metric 3 -->
      <text x="210" y="20" class="metric-num">ACTIVE</text>
      <text x="210" y="38" class="metric-lbl" style="fill:#10B981;">STATUS: READY</text>
    </g>
  </g>
</svg>
