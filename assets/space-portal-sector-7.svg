<svg width="680" height="128" viewBox="0 0 680 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .tag-lbl         { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #00F0FF; letter-spacing: 1.2px; }
      .sub-lbl         { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; fill: #71737E; letter-spacing: 1.2px; }
      .stat-card       { fill: #111216; stroke: #1F2430; stroke-width: 1.2; }
      .card-title      { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #71737E; letter-spacing: 1.5px; }
      .metric-val      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 900; fill: #FDFBF7; }
      .metric-sub      { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; fill: #A0A5B5; }
      @keyframes beaconBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
      .beacon { animation: beaconBlink 1.2s steps(2, start) infinite; }
    </style>
  </defs>

  <rect width="680" height="128" fill="#0B0C10"/>

  <g transform="translate(16, 22)">
    <circle cx="0" cy="5" r="4" fill="#00F0FF" class="beacon"/>
    <text x="14" y="9" class="tag-lbl">PORTAL GATEWAY // SECTOR 07: SENSOR ARRAY &amp; ORBITAL RADAR</text>
  </g>
  <text x="16" y="48" class="sub-lbl">[360° DEEP-SPACE SCANNER ACTIVE]</text>
  <line x1="0" y1="56" x2="680" y2="56" stroke="#1F2430" stroke-width="1.2"/>

  <g transform="translate(16, 66)">
    <g transform="translate(0, 0)">
      <rect width="210" height="54" rx="4" class="stat-card"/>
      <rect x="0" y="0" width="3" height="54" fill="#00F0FF"/>
      <text x="14" y="16" class="card-title">SCANNER ARRAY</text>
      <text x="14" y="34" class="metric-val">RADAR ONLINE</text>
      <text x="14" y="47" class="metric-sub">&gt; Proximity telemetry active</text>
    </g>
    <g transform="translate(222, 0)">
      <rect width="210" height="54" rx="4" class="stat-card"/>
      <rect x="0" y="0" width="3" height="54" fill="#2563EB"/>
      <text x="14" y="16" class="card-title">SECTOR ORIGIN</text>
      <text x="14" y="34" class="metric-val">MUMBAI ORBIT</text>
      <text x="14" y="47" class="metric-sub">&gt; Dombivli, Maharashtra, IN</text>
    </g>
    <g transform="translate(444, 0)">
      <rect width="220" height="54" rx="4" class="stat-card"/>
      <rect x="0" y="0" width="3" height="54" fill="#39D353"/>
      <text x="14" y="16" class="card-title">SUBSPACE RELAY</text>
      <text x="14" y="34" class="metric-val">LINK ESTABLISHED</text>
      <text x="14" y="47" class="metric-sub">&gt; Real-time traffic monitoring</text>
    </g>
  </g>
</svg>
