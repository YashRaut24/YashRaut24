<svg width="480" height="34" viewBox="0 0 480 34" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .radar-desc-h { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #FDFBF7; }
      .radar-desc-p { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 8.5px; fill: #A0A5B5; }
      @keyframes beaconBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
      .beacon { animation: beaconBlink 1.2s steps(2, start) infinite; }
    </style>
  </defs>
  <rect width="480" height="34" rx="4" fill="#111216"/>
  <circle cx="12" cy="17" r="3" fill="#00F0FF" class="beacon"/>
  <text x="22" y="14" class="radar-desc-h">Deep-Space Subspace Sensor Array &amp; Orbital Visitor Tracking</text>
  <text x="22" y="26" class="radar-desc-p">360-degree sector surveillance tracking visitor trajectories.</text>
</svg>
