<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .deck-bg    { fill: #08090C; stroke: #1E2638; stroke-width: 1.5; }
      .tile-card  { fill: #0E121A; stroke: #1E2638; stroke-width: 1; }
      .tile-tag   { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #00F0FF; letter-spacing: 1.2px; }
      .tile-head  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 15px; font-weight: 800; fill: #FFFFFF; }
      .tile-item  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; fill: #E2E8F0; }
      .tile-desc  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 11px; fill: #64748B; }
      .chip-cyan  { fill: #0D2229; stroke: #0E4E59; stroke-width: 1; }
      .chip-purp  { fill: #1C122B; stroke: #451E6B; stroke-width: 1; }
      .chip-amber { fill: #241A0B; stroke: #5C3D12; stroke-width: 1; }
    </style>
  </defs>

  <rect width="850" height="260" rx="8" class="deck-bg"/>

  <!-- 3 Columns: Width 254 each, Gap 14, Total 790 -->
  
  <!-- Col 1: AI & AGENTS -->
  <g transform="translate(22, 22)">
    <rect width="254" height="216" rx="6" class="tile-card"/>
    <text x="18" y="24" class="tile-tag">01 // AI &amp; NEURAL CORE</text>
    <text x="18" y="48" class="tile-head">Agentic AI &amp; RAG</text>

    <g transform="translate(18, 74)">
      <circle cx="4" cy="4" r="2.5" fill="#00F0FF"/>
      <text x="14" y="8" class="tile-item">LangChain Multi-Agents</text>
      <text x="14" y="22" class="tile-desc">Autonomous tool use &amp; logic routing</text>

      <circle cx="4" cy="42" r="2.5" fill="#00F0FF"/>
      <text x="14" y="46" class="tile-item">ChromaDB Vector Store</text>
      <text x="14" y="60" class="tile-desc">Semantic similarity &amp; embeddings</text>

      <circle cx="4" cy="80" r="2.5" fill="#00F0FF"/>
      <text x="14" y="84" class="tile-item">Groq &amp; OpenAI API</text>
      <text x="14" y="98" class="tile-desc">High-throughput sub-50ms inference</text>
    </g>
  </g>

  <!-- Col 2: DISTRIBUTED FULL-STACK -->
  <g transform="translate(298, 22)">
    <rect width="254" height="216" rx="6" class="tile-card"/>
    <text x="18" y="24" class="tile-tag" style="fill:#A855F7;">02 // WEB &amp; API ENGINES</text>
    <text x="18" y="48" class="tile-head">Full-Stack Architecture</text>

    <g transform="translate(18, 74)">
      <circle cx="4" cy="4" r="2.5" fill="#A855F7"/>
      <text x="14" y="8" class="tile-item">React &amp; Next.js</text>
      <text x="14" y="22" class="tile-desc">SSR, App Router &amp; reactive client</text>

      <circle cx="4" cy="42" r="2.5" fill="#A855F7"/>
      <text x="14" y="46" class="tile-item">FastAPI &amp; Python</text>
      <text x="14" y="60" class="tile-desc">Async IO endpoints &amp; schema validation</text>

      <circle cx="4" cy="80" r="2.5" fill="#A855F7"/>
      <text x="14" y="84" class="tile-item">Node.js &amp; Express</text>
      <text x="14" y="98" class="tile-desc">RESTful microservices &amp; middleware</text>
    </g>
  </g>

  <!-- Col 3: CLOUD & DATA -->
  <g transform="translate(574, 22)">
    <rect width="254" height="216" rx="6" class="tile-card"/>
    <text x="18" y="24" class="tile-tag" style="fill:#F59E0B;">03 // DATA &amp; DEVOPS</text>
    <text x="18" y="48" class="tile-head">Infrastructure &amp; DB</text>

    <g transform="translate(18, 74)">
      <circle cx="4" cy="4" r="2.5" fill="#F59E0B"/>
      <text x="14" y="8" class="tile-item">PostgreSQL &amp; MongoDB</text>
      <text x="14" y="22" class="tile-desc">Relational &amp; document modeling</text>

      <circle cx="4" cy="42" r="2.5" fill="#F59E0B"/>
      <text x="14" y="46" class="tile-item">Docker Containers</text>
      <text x="14" y="60" class="tile-desc">Reproducible deployment environments</text>

      <circle cx="4" cy="80" r="2.5" fill="#F59E0B"/>
      <text x="14" y="84" class="tile-item">Git &amp; Vercel CI/CD</text>
      <text x="14" y="98" class="tile-desc">Automated release &amp; edge hosting</text>
    </g>
  </g>
</svg>
