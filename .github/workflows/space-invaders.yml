name: generate space invaders commit arcade
 
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    permissions:
      contents: write
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
 
      - name: Generate Space Invaders SVG from Live GitHub Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_space_invaders.py
 
      - name: Update live GitHub contribution telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
 
          TOKEN = os.environ["GITHUB_TOKEN"]
          LOGIN = "YashRaut24"
          SVG_PATH = Path("assets/space-portal-unified.svg")
          STATS_SVG_PATH = Path("assets/space-portal-stats.svg")
 
          def graphql(query, variables):
              body = json.dumps({
                  "query": query,
                  "variables": variables,
              }).encode("utf-8")
 
              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=body,
                  headers={
                      "Authorization": f"bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "YashRaut24-profile-telemetry",
                  },
                  method="POST",
              )
 
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
 
              if payload.get("errors"):
                  raise SystemExit(
                      "GitHub GraphQL error: "
                      + json.dumps(payload["errors"])
                  )
 
              return payload["data"]
 
          QUERY = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """
 
          today = datetime.now(timezone.utc).date()
 
          # The profile's telemetry period starts on Aug 9, 2024.
          period_start = date(2024, 8, 9)
 
          # Sum non-overlapping yearly ranges so the all-time telemetry is
          # not limited to the normal one-year profile calendar.
          ranges = []
          cursor = period_start
          while cursor <= today:
              end = min(cursor.replace(year=cursor.year + 1) - timedelta(days=1), today)
              ranges.append((cursor, end))
              cursor = end + timedelta(days=1)
 
          total_contributions = 0
          total_commits = 0
 
          for start, end in ranges:
              data = graphql(
                  QUERY,
                  {
                      "login": LOGIN,
                      "from": f"{start.isoformat()}T00:00:00Z",
                      "to": f"{end.isoformat()}T23:59:59Z",
                  },
              )
              collection = data["user"]["contributionsCollection"]
              total_contributions += collection["contributionCalendar"]["totalContributions"]
              total_commits += collection["totalCommitContributions"]
 
          # Fetch the latest year's daily calendar for current/longest streaks.
          streak_start = today - timedelta(days=366)
          streak_data = graphql(
              QUERY,
              {
                  "login": LOGIN,
                  "from": f"{streak_start.isoformat()}T00:00:00Z",
                  "to": f"{today.isoformat()}T23:59:59Z",
              },
          )["user"]["contributionsCollection"]
 
          days = []
          for week in streak_data["contributionCalendar"]["weeks"]:
              for day in week["contributionDays"]:
                  days.append(
                      (
                          date.fromisoformat(day["date"]),
                          int(day["contributionCount"]),
                      )
                  )
 
          days.sort()
 
          # Keep only dates in the requested period.
          days = [(d, c) for d, c in days if streak_start <= d <= today]
 
          # Build dictionary of all days for accurate streak logic.
          day_map = {d: c for d, c in days}
 
          # Current streak: active if today has contributions OR yesterday has contributions
          current_streak = 0
          current_start = None
          current_end = None
 
          if day_map.get(today, 0) > 0:
              current_end = today
              cur = today
              while cur in day_map and day_map[cur] > 0:
                  current_streak += 1
                  current_start = cur
                  cur -= timedelta(days=1)
          elif day_map.get(today - timedelta(days=1), 0) > 0:
              current_end = today - timedelta(days=1)
              cur = current_end
              while cur in day_map and day_map[cur] > 0:
                  current_streak += 1
                  current_start = cur
                  cur -= timedelta(days=1)
 
          # Longest consecutive run of contribution days.
          longest_streak = 0
          longest_start = None
          longest_end = None
          run = 0
          run_start = None
          prev_active_date = None
 
          for d, count in days:
              if count > 0:
                  if prev_active_date is not None and d == prev_active_date + timedelta(days=1):
                      run += 1
                  else:
                      run = 1
                      run_start = d
                  prev_active_date = d
                  if run > longest_streak:
                      longest_streak = run
                      longest_start = run_start
                      longest_end = d
              else:
                  run = 0
                  run_start = None
                  prev_active_date = None
 
          # Fetch live visitor count (Orbital Traffic)
          visitor_count = None
          try:
              req = urllib.request.Request(
                  f"https://komarev.com/ghpvc/?username={LOGIN}",
                  headers={"User-Agent": "Mozilla/5.0 (Space-Invaders-Telemetry)"}
              )
              with urllib.request.urlopen(req, timeout=10) as resp:
                  komarev_svg = resp.read().decode("utf-8")
                  matches = re.findall(r'<text[^>]*>(\d+)</text>', komarev_svg)
                  if matches:
                      visitor_count = int(matches[-1])
          except Exception as e:
              print(f"Komarev visitor fetch note: {e}")
 
          def fmt_number(value):
              return f"{value:,}"
 
          def fmt_range(start, end):
              if start is None or end is None:
                  return "—"
              if start.year == end.year:
                  return f"{start.strftime('%b %d')} – {end.strftime('%b %d')}"
              return f"{start.strftime('%b %d, %Y')} – {end.strftime('%b %d, %Y')}"
 
          def patch_stats_block(svg_text, label):
              """Apply live Total Contributions / Current Streak / Longest
              Streak values to any SVG that contains this shared block
              (assets/space-portal-unified.svg and
              assets/space-portal-stats.svg share identical markup here)."""
 
              # Top contribution total.
              svg_text, n = re.subn(
                  r'(<text x="0" y="0" text-anchor="middle" class="num-val">)[^<]*(</text>)',
                  rf'\g<1>{fmt_number(total_contributions)}\g<2>',
                  svg_text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f"Could not update Total Contributions in {label}.")
 
              # Current streak.
              svg_text, n = re.subn(
                  r'(<text x="0" y="12" text-anchor="middle" class="num-val" style="fill:#FDFBF7;">)[^<]*(</text>)',
                  rf'\g<1>{current_streak}\g<2>',
                  svg_text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f"Could not update Current Streak in {label}.")
 
              svg_text, n = re.subn(
                  r'(<text x="0" y="76" text-anchor="middle" class="date-txt">)[^<]*(</text>)',
                  rf'\g<1>{fmt_range(current_start, current_end)}\g<2>',
                  svg_text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f"Could not update Current Streak dates in {label}.")
 
              # Longest streak.
              svg_text, n = re.subn(
                  r'(<text x="0" y="0" text-anchor="middle" class="num-sub" style="fill:#2563EB;">)[^<]*(</text>)',
                  rf'\g<1>{longest_streak}\g<2>',
                  svg_text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f"Could not update Longest Streak in {label}.")
 
              svg_text, n = re.subn(
                  r'(<g transform="translate\(710, 48\)">.*?<text x="0" y="44" text-anchor="middle" class="date-txt">)[^<]*(</text>)',
                  rf'\g<1>{fmt_range(longest_start, longest_end)}\g<2>',
                  svg_text,
                  count=1,
                  flags=re.DOTALL,
              )
              if n != 1:
                  raise SystemExit(f"Could not update Longest Streak dates in {label}.")
 
              return svg_text
 
          svg = SVG_PATH.read_text(encoding="utf-8")
          svg = patch_stats_block(svg, str(SVG_PATH))
 
          # Git telemetry commit total (unified portal only).
          svg, n = re.subn(
              r'(<text x="14" y="42" class="metric-val">)[^<]*( COMMITS</text>)',
              rf'\g<1>{fmt_number(total_commits)}\g<2>',
              svg,
              count=1,
          )
          if n != 1:
              raise SystemExit("Could not update Git telemetry commit total.")
 
          # Update Orbital Traffic visitor count (Sector 7)
          if visitor_count is not None:
              formatted_visitors = f"{visitor_count:,}"
              svg, n = re.subn(
                  r'(<text x="111" y="12.5" text-anchor="middle" dominant-baseline="middle" class="traffic-val">)[^<]*(</text>)',
                  rf'\g<1>{formatted_visitors}\g<2>',
                  svg,
                  count=1,
              )
              if n >= 1:
                  print(f"Updated Orbital Traffic visitor count in unified SVG: {formatted_visitors}")
 
              # Also update standalone sector-7 svg if present
              s7_path = Path("assets/space-portal-sector-7.svg")
              if s7_path.exists():
                  s7_svg = s7_path.read_text(encoding="utf-8")
                  s7_svg = re.sub(
                      r'(<text x="111" y="12.5" text-anchor="middle" dominant-baseline="middle" class="traffic-val">)[^<]*(</text>)',
                      rf'\g<1>{formatted_visitors}\g<2>',
                      s7_svg,
                      count=1,
                  )
                  s7_path.write_text(s7_svg, encoding="utf-8")
 
          # Also refresh the standalone stats card with the same live values.
          if STATS_SVG_PATH.exists():
              stats_svg = STATS_SVG_PATH.read_text(encoding="utf-8")
              stats_svg = patch_stats_block(stats_svg, str(STATS_SVG_PATH))
              STATS_SVG_PATH.write_text(stats_svg, encoding="utf-8")
          else:
              print(f"{STATS_SVG_PATH} not found -- skipping.")
 
          # Keep the existing counter styling, but show the live total
          # immediately instead of replaying a multi-minute historical count.
          live_counter_css = (
              "@keyframes counterPulse{0%{opacity:0;}2%{opacity:1;}"
              "98%{opacity:1;}100%{opacity:0;}}"
              "@keyframes counterFinal{0%{opacity:1;}100%{opacity:1;}}"
              ".counter{opacity:1;animation-timing-function:linear;"
              "animation-iteration-count:1;animation-fill-mode:forwards;}"
              ".cnt-live{animation-name:counterFinal;"
              "animation-delay:0s;animation-duration:0s;}"
              "\n/* ARCADE_STYLE_END */"
          )
 
          css_pattern = re.compile(
              r'@keyframes counterPulse\{.*?/\* ARCADE_STYLE_END \*/',
              re.DOTALL,
          )
          svg, n = css_pattern.subn(
              live_counter_css,
              svg,
              count=1,
          )
          if n != 1:
              raise SystemExit("Could not rebuild arcade counter CSS.")
 
          counter_pattern = re.compile(
              r'<g transform="translate\(555,9\)">.*?</g>',
              re.DOTALL,
          )
          counter_replacement = (
              '<g transform="translate(555,9)">\n'
              '<rect width="275" height="28" rx="4" class="counter-box" />\n'
              f'<text x="137" y="19" text-anchor="middle" '
              f'class="counter cnt-live">DESTROYED: [ '
              f'{total_commits:,} / {total_commits:,} ]</text>\n'
              '</g>'
          )
 
          svg, n = counter_pattern.subn(
              counter_replacement,
              svg,
              count=1,
          )
          if n != 1:
              raise SystemExit("Could not rebuild arcade counter.")
 
          SVG_PATH.write_text(svg, encoding="utf-8")
 
          print(f"Live total contributions: {total_contributions:,}")
          print(f"Live total commits: {total_commits:,}")
          print(f"Live current streak: {current_streak}")
          print(f"Live longest streak: {longest_streak}")
          print(f"Current streak range: {fmt_range(current_start, current_end)}")
          print(f"Longest streak range: {fmt_range(longest_start, longest_end)}")
          if visitor_count is not None:
              print(f"Live orbital traffic visitors: {visitor_count:,}")
          print(f"Arcade counter max: {total_commits:,}")
          PY
 
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
 
          git add assets/*.svg
 
          git diff --cached --quiet && {
            echo "No changes to commit."
            exit 0
          }
 
          git commit -m "chore: update live GitHub contribution telemetry"
          git push